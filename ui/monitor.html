<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monitor — uniAIverse</title><link rel="stylesheet" href="/assets/uav.css"><script src="/assets/nav.js" defer></script><script src="/assets/widget.js" defer></script></head>
<body><header><h1>Monitoring</h1><p class="hint">Platform, LLM gateway metering, tenant usage, audit, provisioning, bot, and the founder hour sheet. Refreshes on demand; nothing here changes anything.</p></header>
<main>
<div class="card"><div style="display:flex;gap:10px;align-items:end;flex-wrap:wrap"><div style="flex:1;min-width:260px"><label>Admin token</label><input type="text" id="tok"></div><button class="primary" id="load">Refresh</button><span class="hint" id="s"></span></div>
<div class="tabs" id="tabs"><button data-t="overview" class="on">Overview</button><button data-t="services">Services</button><button data-t="gateway">LLM gateway</button><button data-t="tenants">Tenants</button><button data-t="audit">Audit</button><button data-t="logs">Logs</button><button data-t="hours">Hours</button></div></div>
<div id="view" class="card"><p class="hint">Paste the token and click Refresh.</p></div>
</main>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])),inr=v=>'₹'+(Math.round((v||0)*100)/100).toLocaleString('en-IN'),ts=v=>v?new Date(v*1000).toLocaleString():'—',H=()=>({'X-Admin-Token':$('tok').value.trim(),'Content-Type':'application/json'});
const tbl=(h,rows)=>`<div class="overflow"><table><tr>${h.map(x=>`<th>${esc(x)}</th>`).join('')}</tr>${rows.length?rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${h.length}" class="hint">nothing yet</td></tr>`}</table></div>`;
const bar=(v,max,cls='')=>`<div class="bar"><i class="${cls}" style="width:${Math.min(100,max?100*v/max:0)}%"></i></div>`;
let M=null,tab='overview';
async function api(p){const r=await fetch('/api/platform/'+p,{headers:H()});const j=await r.json();if(!r.ok)throw new Error(typeof j.detail==='string'?j.detail:JSON.stringify(j.detail));return j;}
async function load(){try{$('s').textContent='Loading…';M=await api('monitor');$('s').textContent='as of '+ts(M.generated);render();}catch(e){$('s').textContent='Error: '+e.message}}
function render(){if(!M)return;const g=M.gateway,v=$('view');
 if(tab==='overview'){const act=Object.entries(M.tenants.active_by_plan||{});v.innerHTML=`<h2>This month (${M.month})</h2><div class="tiles"><div class="tile"><b>${g.calls}</b><span>gateway calls · ${g.denied} denied</span></div><div class="tile"><b>${inr(g.cost_inr)}</b><span>LLM spend · cap ${inr(g.global_cap_inr)}</span></div><div class="tile"><b>${(g.tokens_in+g.tokens_out).toLocaleString('en-IN')}</b><span>tokens</span></div><div class="tile"><b>${inr(g.today_cost_inr)}</b><span>today · ${g.today_calls} calls</span></div><div class="tile"><b>${M.usage.events}</b><span>entitlement events · ${M.usage.denied} denied</span></div><div class="tile"><b>${M.free_pool.queries_used}/${M.free_pool.monthly_queries}</b><span>free pool · ${M.free_pool.status}</span></div><div class="tile"><b>${M.hours.total_hours}</b><span>team hours</span></div><div class="tile"><b>${M.bot.unanswered}</b><span>bot unanswered (30d)</span></div></div>
  <h3>LLM spend vs platform cap</h3>${bar(g.cost_inr,g.global_cap_inr,g.pct_of_cap>90?'danger':g.pct_of_cap>70?'warn':'')}<p class="hint">${g.pct_of_cap??0}% of ${inr(g.global_cap_inr)} · provider ${esc(M.llm_provider)} · entitlements <b>${esc(M.entitlements_mode)}</b></p>
  <h3>Active tenants by plan</h3>${act.length?act.map(([p,n])=>`<span class="badge ${p}">${p}: ${n}</span> `).join(''):'<span class="hint">none yet</span>'}
  ${M.tenants.at_risk.length?`<div class="warn"><b>${M.tenants.at_risk.length} tenant(s) at risk:</b> ${M.tenants.at_risk.map(t=>`${esc(t.name)} (${t.state}, projected ${inr(t.projected)} of ${inr(t.budget)})`).join('; ')}</div>`:'<div class="okbox">No tenant over budget.</div>'}
  ${M.tenants.failed_jobs.length?`<div class="warn"><b>Failed provisioning:</b> ${M.tenants.failed_jobs.map(j=>esc(j.id+' '+j.tenant_id+': '+j.error)).join('; ')}</div>`:''}
  <h3>Cost model</h3><p class="hint">Fixed ${inr(M.cost_model.fixed_monthly_inr)}/month · break-even tenants ${esc(JSON.stringify(M.cost_model.break_even_tenants))} · ${esc(M.cost_model.status)}</p>`;}
 else if(tab==='services'){v.innerHTML=`<h2>Services</h2>`+tbl(['Id','Title','Owner','Status','Enabled'],M.services.map(s=>[s.id,esc(s.title),esc(s.owner),esc(s.status),s.enabled?'<span class="st ACTIVE">on</span>':'<span class="st">off</span>']))+`<p class="hint">Enable or disable in <code>.env → ENABLED_SERVICES</code>, then restart. Version ${esc(M.version)}.</p>`;}
 else if(tab==='gateway'){v.innerHTML=`<h2>LLM gateway metering (${M.month})</h2><h3>By day</h3>`+tbl(['Day','Calls','Cost'],g.by_day.map(d=>[d.day,d.calls,inr(d.cost)]))+`<h3>By tenant / cohort</h3>`+tbl(['Tenant','Name','Plan','Calls','Denied','Cost'],g.by_tenant.map(t=>[t.tenant_id,esc(t.name||'—'),`<span class="badge ${t.plan}">${esc(t.plan||'?')}</span>`,t.calls,t.denied,inr(t.cost)]))+`<h3>By model class</h3>`+tbl(['Class','Provider','Calls','Cost'],g.by_model.map(x=>[x.model_class,x.provider,x.calls,inr(x.cost)]))+`<h3>Top capabilities (entitlement events)</h3>`+tbl(['Capability','Events','Denied'],M.usage.top_capabilities.map(x=>[x.capability,x.n,x.denied]));}
 else if(tab==='tenants'){v.innerHTML=`<h2>Tenants</h2><div class="tiles">${Object.entries(M.tenants.by_state).map(([s,n])=>`<div class="tile"><b>${n}</b><span><span class="st ${s}">${s}</span></span></div>`).join('')}</div><h3>Provisioning jobs</h3><p>${Object.entries(M.tenants.jobs).map(([s,n])=>`${s}: ${n}`).join(' · ')||'none'}</p><p class="hint">Open a tenant in the <a href="/platform">control plane</a> to change limits or state.</p>`;}
 else if(tab==='audit'){v.innerHTML=`<h2>Audit trail (last 50)</h2>`+tbl(['When','Tenant','Who','Action','Detail'],M.audit.map(a=>[ts(a.created_at),a.tenant_id||'—',esc(a.actor),esc(a.action),esc(a.detail)]));}
 else if(tab==='logs'){v.innerHTML=`<h2>Logs</h2><div class="tabs">${['audit','gateway','usage','provisioning','bot','hours'].map(k=>`<button onclick="logs('${k}')">${k}</button>`).join('')}</div><div id="logout" class="hint">Pick a log.</div>`;}
 else if(tab==='hours'){const h=M.hours;v.innerHTML=`<h2>Founder and mentor hour sheet (${h.month})</h2><div class="tiles">${h.by_person.map(p=>`<div class="tile"><b>${p.hours}${p.ceiling?' / '+p.ceiling:''}</b><span>${esc(p.person)} · ${inr(p.opportunity_cost_inr)} opportunity cost${p.over?' · <b style="color:var(--danger)">over ceiling</b>':''}</span></div>`).join('')||'<div class="tile"><b>0</b><span>no entries yet</span></div>'}</div>
  <h3>Log hours</h3><div class="grid"><div><label>Person</label><select id="hp"><option>Sarfi</option><option>Sachin</option><option>Harsh</option></select></div><div><label>Day</label><input type="date" id="hd" value="${new Date().toISOString().slice(0,10)}"></div><div><label>Activity</label><select id="ha"><option>cohort delivery</option><option>cohort prep</option><option>corporate workshop</option><option>consulting pilot</option><option>sales</option><option>content</option><option>admin</option><option>engineering</option><option>devops</option><option>learning</option></select></div><div><label>Hours</label><input type="number" id="hh" step="0.5" min="0.5" max="24" value="2"></div><div><label>Note / tenant id</label><input type="text" id="hn"></div></div><p><button class="primary" onclick="logH()">Add</button></p>
  <h3>By activity</h3>${tbl(['Activity','Hours'],h.by_activity.map(a=>[esc(a.activity),a.hours]))}<h3>Entries</h3>${tbl(['Day','Person','Activity','Hours','Note'],h.entries.map(e=>[e.day,esc(e.person),esc(e.activity),e.hours,esc(e.note||'')]))}`;}
}
async function logs(k){try{const rows=await api('monitor/logs?kind='+k+'&limit=200');const cols=rows.length?Object.keys(rows[0]):['(empty)'];$('logout').innerHTML=tbl(cols,rows.map(r=>cols.map(c=>c==='created_at'||c==='finished_at'?ts(r[c]):esc(r[c]))));}catch(e){$('logout').textContent='Error: '+e.message}}
async function logH(){try{const r=await fetch('/api/platform/hours',{method:'POST',headers:H(),body:JSON.stringify({person:$('hp').value,day:$('hd').value,activity:$('ha').value,hours:+$('hh').value,note:$('hn').value})});if(!r.ok)throw new Error((await r.json()).detail);await load();}catch(e){alert(e.message)}}
$('tabs').addEventListener('click',e=>{if(e.target.dataset.t){tab=e.target.dataset.t;[...$('tabs').children].forEach(b=>b.classList.toggle('on',b===e.target));render();}});
$('load').onclick=load;document.addEventListener('DOMContentLoaded',()=>{if(location.hash==='#logs'){tab='logs'}if(location.hash==='#hours'){tab='hours'}[...$('tabs').children].forEach(b=>b.classList.toggle('on',b.dataset.t===tab));if(sessionStorage.getItem('uav_admin_token'))load()});
</script></body></html>
