<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Control plane — uniAIverse</title>
<style>
:root{--ink:#14213d;--paper:#fbfaf7;--line:#d9d6cf;--accent:#0f766e;--muted:#5b6170;--warn:#b45309}*{box-sizing:border-box}
body{margin:0;font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;background:var(--paper);color:var(--ink);line-height:1.5}header,main{max-width:1080px;margin:0 auto;padding:0 20px}header{padding-top:26px}h1{margin:0;font-size:1.8rem;font-weight:600}h2{font-size:1.15rem;margin:0 0 8px}h3{font-size:1rem;margin:12px 0 4px}
.hint{color:var(--muted);font-size:.9rem}.card{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:#fff;margin:14px 0}label{display:block;font-size:.85rem;color:var(--muted);margin-top:6px}input,select{font:inherit;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff}
button{font:inherit;border-radius:6px;padding:7px 12px;cursor:pointer;background:#fff;border:1px solid var(--line)}button.p{background:var(--accent);color:#fff;border:0}table{border-collapse:collapse;width:100%;font-size:.85rem}th,td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}th{color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.tile{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff}.tile b{display:block;font-size:1.2rem}.tile span{font-size:.8rem;color:var(--muted)}.warn{border-left:4px solid var(--warn);background:#fff7ed;padding:8px 12px;margin:8px 0;font-size:.9rem}
.st{display:inline-block;border-radius:999px;padding:1px 10px;font-size:.8rem;color:#fff;background:#64748b}.st.ACTIVE{background:var(--accent)}.st.PENDING{background:#ca8a04}.st.PAYMENT_PENDING{background:#b45309}.st.SUSPENDED,.st.QUOTA_EXCEEDED,.st.EXPIRED{background:#b91c1c}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 14px}pre{font-size:.8rem;white-space:pre-wrap}details{margin:6px 0}summary{cursor:pointer;color:var(--accent)}
</style></head><body><header><h1>Control plane</h1><p class="hint">Approval → plan → entitlements → quotas → resources. Nothing is provisioned until you approve it; nothing runs beyond its plan. Admin token required.</p></header>
<main><div class="card"><label>Admin token</label><input id="tok" style="width:320px" placeholder="ADMIN_TOKEN from .env"> <button class="p" id="load">Load</button> <span class="hint" id="s"></span></div>
<div id="sb"></div><div class="card"><h2>Access requests</h2><div id="req"></div></div><div class="card"><h2>Tenants</h2><div id="ten"></div></div><div class="card"><h2>Tenant detail</h2><div id="det" class="hint">Click a tenant.</div></div>
<div class="card"><h2>Cost model</h2><p class="hint">Mix: <input id="mb" type="number" value="4" style="width:60px"> Bronze <input id="ms" type="number" value="2" style="width:60px"> Silver <input id="mg" type="number" value="0" style="width:60px"> Gold <button id="cost">Compute</button></p><div id="cm"></div></div></main>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])),H=()=>({'X-Admin-Token':$('tok').value.trim(),'Content-Type':'application/json'}),inr=v=>'₹'+Math.round(v||0).toLocaleString('en-IN');
const tbl=(h,rows)=>`<table><tr>${h.map(x=>`<th>${esc(x)}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table>`;
async function api(p,m='GET',b){const r=await fetch('/api/platform/'+p,{method:m,headers:H(),body:b?JSON.stringify(b):undefined});const j=await r.json();if(!r.ok)throw new Error(typeof j.detail==='string'?j.detail:JSON.stringify(j.detail));return j;}
async function load(){try{const q=await api('requests');const s=q.sandbox;$('sb').innerHTML=`<div class="card"><h2>Free sandbox pool — ${esc(s.status)}${s.approvals_paused?' (approvals paused)':''}</h2><div class="tiles"><div class="tile"><b>${s.queries_used} / ${s.monthly_queries}</b><span>queries this month</span></div><div class="tile"><b>${inr(s.spend_inr)} / ${inr(s.monthly_budget_inr)}</b><span>spend vs cap</span></div><div class="tile"><b>${s.approved_users} / ${s.max_approved_users}</b><span>approved free users</span></div><div class="tile"><b>${s.can_approve_more?'yes':'NO'}</b><span>can approve more?</span></div></div><p><button onclick="pause(true)">Pause free approvals</button> <button onclick="pause(false)">Resume</button> <button onclick="api('provision/run','POST').then(r=>{alert(JSON.stringify(r.ran));load()})">Run provisioning now</button> <button onclick="api('scheduler/nightly','POST').then(r=>{alert(JSON.stringify(r));load()})">Run nightly (expiry + provisioning)</button></p></div>`;
 $('req').innerHTML=q.pending.length?tbl(['Id','Organisation','Contact','Wants','Purpose','Decide'],q.pending.map(p=>[p.id,esc(p.name),`${esc(p.contact_name)}<br><span class="hint">${esc(p.contact_email)}</span>`,esc(p.requested_plan),esc(p.purpose),`<select id="pl_${p.id}"><option value="">as requested</option><option>free</option><option>bronze</option><option>silver</option><option>gold</option></select> <button class="p" onclick="decide('${p.id}','approve')">Approve</button> <button onclick="decide('${p.id}','reject')">Reject</button>`])):'<p class="hint">No pending requests.</p>';
 const t=await api('tenants');$('ten').innerHTML=t.length?tbl(['Id','Organisation','Plan','State','Queries','Spend','Expires',''],t.map(x=>[x.id,esc(x.name),esc(x.plan||'('+x.requested_plan+')'),`<span class="st ${x.state}">${x.state}</span>`,x.queries,inr(x.spend_inr),x.expires_at?new Date(x.expires_at*1000).toLocaleDateString():'—',`<button onclick="detail('${x.id}')">Open</button>`])):'<p class="hint">No tenants yet.</p>';$('s').textContent='';}catch(e){$('s').textContent='Error: '+e.message;}}
async function decide(id,what){try{const r=await api(`${what}/${id}`,'POST',{plan:$('pl_'+id).value||null,decided_by:'admin console',note:''});alert(what==='approve'?`${id}: ${r.state}${r.pay_url?' — send the customer '+r.pay_url:''}`:`${id}: rejected`);load();}catch(e){alert(e.message)}}
async function pause(p){await api('sandbox/pause?paused='+p,'POST');load()}
async function detail(id){try{const d=await api('tenants/'+id);const moves={ACTIVE:['SUSPENDED','CANCELLED'],SUSPENDED:['ACTIVE','CANCELLED'],PAYMENT_PENDING:['CANCELLED'],QUOTA_EXCEEDED:['ACTIVE','SUSPENDED'],EXPIRED:['PAYMENT_PENDING','CANCELLED'],APPROVED:['CANCELLED']}[d.state]||[];
 $('det').innerHTML=`<h2>${esc(d.organisation)} <span class="st ${d.state}">${d.state}</span> <span class="hint">${d.id} · ${esc(d.plan)} · ${esc(d.contact.name)} ${esc(d.contact.email)}</span></h2>${d.over_budget_risk?'<div class="warn">Projected spend exceeds this tenant\'s monthly budget.</div>':''}
 <div class="tiles"><div class="tile"><b>${d.users}</b><span>users</span></div><div class="tile"><b>${d.queries}</b><span>AI queries</span></div><div class="tile"><b>${d.storage_gb}</b><span>storage GB</span></div><div class="tile"><b>${d.knowledge_bases}</b><span>knowledge bases</span></div><div class="tile"><b>${inr(d.spend_inr_month_to_date)}</b><span>spend month to date</span></div><div class="tile"><b>${inr(d.projected_spend_inr)} / ${inr(d.monthly_spend_limit_inr)}</b><span>projected / budget</span></div></div>
 <h3>Capabilities</h3><p>${d.capabilities.map(c=>`<code>${esc(c)}</code>`).join(' ')}</p>
 <h3>Change limits (no redeploy)</h3><div class="grid">${Object.entries(d.limits).map(([k,v])=>`<div><label>${esc(k)}</label><input id="lim_${k}" type="number" value="${v??''}" style="width:100%"></div>`).join('')}<div><label>Add capability</label><input id="cap_add" style="width:100%" placeholder="agent.run"></div><div><label>Remove capability</label><input id="cap_rm" style="width:100%"></div><div><label>Reason (required)</label><input id="lim_reason" style="width:100%"></div></div><p><button class="p" onclick="saveLimits('${d.id}')">Apply limits</button> ${moves.map(m=>`<button onclick="move('${d.id}','${m}')">→ ${m}</button>`).join(' ')} ${d.state==='PAYMENT_PENDING'?`<button class="p" onclick="paid('${d.id}')">Mark paid (bank transfer)</button>`:''}</p>
 <details><summary>Environment</summary><pre>${esc(JSON.stringify(d.environment,null,2))}</pre></details><details><summary>Usage by capability</summary>${tbl(['Capability','Units','Cost','Denied'],d.usage_by_capability.map(u=>[esc(u.capability),u.units,inr(u.cost_inr),u.denied]))}</details><details><summary>Provisioning jobs</summary>${tbl(['Job','Status','Steps','Error'],d.jobs.map(j=>[j.id,j.status,esc(j.steps),esc(j.error||'')]))}</details><details open><summary>Audit trail</summary>${tbl(['When','Who','Action','Detail'],d.audit.map(a=>[new Date(a.created_at*1000).toLocaleString(),esc(a.actor),esc(a.action),esc(a.detail)]))}</details>`;window.scrollTo({top:$('det').offsetTop-20,behavior:'smooth'});}catch(e){alert(e.message)}}
async function saveLimits(id){const b={reason:$('lim_reason').value,by:'admin console'};document.querySelectorAll('[id^=lim_]').forEach(i=>{const k=i.id.slice(4);if(k!=='reason'&&i.value!=='')b[k]=+i.value});if($('cap_add').value)b.capabilities_add=[$('cap_add').value.trim()];if($('cap_rm').value)b.capabilities_remove=[$('cap_rm').value.trim()];try{await api(`tenants/${id}/limits`,'PATCH',b);detail(id);load();}catch(e){alert(e.message)}}
async function move(id,to){const note=prompt(`Reason for → ${to}`)||'';try{await api(`tenants/${id}/state/${to}`,'POST',{decided_by:'admin console',note});detail(id);load();}catch(e){alert(e.message)}}
async function paid(id){try{await api(`tenants/${id}/mark-paid`,'POST',{decided_by:'admin console',note:'bank transfer confirmed'});setTimeout(()=>{detail(id);load()},800);}catch(e){alert(e.message)}}
$('cost').onclick=async()=>{try{const m=await api(`cost-model?bronze=${$('mb').value}&silver=${$('ms').value}&gold=${$('mg').value}`);const P=m.plans;$('cm').innerHTML=`<div class="warn">${esc(m.status)}</div><div class="tiles"><div class="tile"><b>${inr(m.fixed_monthly_inr)}</b><span>fixed cost / month (control plane + sandbox)</span></div><div class="tile"><b>${inr(m.monthly.revenue)}</b><span>revenue at this mix</span></div><div class="tile"><b>${inr(m.monthly.operating_result)}</b><span>operating result / month</span></div><div class="tile"><b>${inr(m.monthly.one_time_setup_fees)}</b><span>one-time setup fees</span></div></div>
 ${tbl(['Plan','Platform fee','Infra billed','Revenue','Cost','Fees','Gross margin','Margin %','Break-even tenants'],Object.entries(P).map(([k,p])=>[k,inr(p.platform_fee_inr),inr(p.infra_billed_inr),inr(p.monthly_revenue_inr),inr(p.monthly_cost_inr),inr(p.payment_fees_inr),inr(p.gross_margin_inr),p.gross_margin_pct+'%',m.break_even_tenants[k]]))}<p class="hint">Founder time (${inr(m.monthly.founder_time_inr_not_included)}/month) is not in these figures. Assumptions: app/services/platform/content/cost_model.yaml.</p>`;}catch(e){alert(e.message)}};
$('load').onclick=load;
</script></body></html>
