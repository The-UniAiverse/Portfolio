<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout — uniAIverse</title>
<style>
  :root{--ink:#14213d;--paper:#fbfaf7;--line:#d9d6cf;--accent:#0f766e;--muted:#5b6170}
  body{margin:0;font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;background:var(--paper);color:var(--ink);line-height:1.5}
  main{max-width:560px;margin:0 auto;padding:28px 20px 80px} h1{font-size:1.7rem;margin:0 0 6px;font-weight:600}
  label{display:block;margin:12px 0 4px;font-weight:600} input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;font:inherit;background:#fff}
  .card{border:1px solid var(--line);border-radius:10px;padding:16px;background:#fff;margin:14px 0}
  button{font:inherit;background:var(--accent);color:#fff;border:0;border-radius:6px;padding:12px 18px;cursor:pointer;margin-top:12px}
  button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)} .hint{color:var(--muted);font-size:.9rem} .ok{color:#15803d} .bad{color:#b91c1c}
  .methods span{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:4px 10px;margin:4px 4px 0 0;font-size:.85rem;background:#fff}
</style></head>
<body><main>
<h1>Checkout</h1>
<p class="hint" id="mode"></p>
<label>What you're buying</label><select id="product"></select>
<div class="card"><div id="price"></div><div class="methods" id="methods"></div></div>
<label>Name</label><input id="name" required>
<label>Email</label><input id="email" type="email" required>
<div id="actions"><button id="card">Pay by card / netbanking / UPI</button> <button class="ghost" id="bank">Pay by NEFT / RTGS / IMPS</button></div>
<div id="out"></div>
<p class="hint">Card details are entered in Razorpay's secure window and never touch our server. Prices include applicable taxes unless stated.</p>
</main>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
const $ = id => document.getElementById(id), API = location.origin + '/api/payments', qs = new URLSearchParams(location.search);
const j = (u,o) => fetch(u,o).then(r => r.json().then(b => ({ok:r.ok,b})));
let CAT;
async function init(){ const {b} = await j(API+'/catalog'); CAT = b; $('mode').textContent = b.live ? 'Secure payments by Razorpay.' : 'TEST MODE — no money moves. Set Razorpay keys in .env to go live.';
  $('product').innerHTML = Object.entries(b.items).map(([id,p]) => `<option value="${id}" ${id===qs.get('product')?'selected':''}>${p.title} — ₹${p.amount_inr.toLocaleString('en-IN')}</option>`).join('');
  $('product').onchange = show; show(); }
function show(){ const p = CAT.items[$('product').value]; const below = p.amount_inr < CAT.upi_limit_inr;
  $('price').innerHTML = `<b>₹${p.amount_inr.toLocaleString('en-IN')}</b> <span class="hint">(≈ $${p.amount_usd})</span>`;
  $('methods').innerHTML = ['Card', below?'UPI':null, 'Netbanking', !below?'NEFT / RTGS / IMPS':null].filter(Boolean).map(m=>`<span>${m}</span>`).join('') +
    `<p class="hint">${below?`UPI is available for amounts under ₹${CAT.upi_limit_inr.toLocaleString('en-IN')}.`:`For ₹${CAT.upi_limit_inr.toLocaleString('en-IN')} and above we accept card, netbanking or bank transfer (UPI not offered).`}</p>`;
  $('bank').style.display = below ? 'none' : 'inline-block'; }
function body(){ return {product_id: $('product').value, customer_name: $('name').value, customer_email: $('email').value, user_id: qs.get('user') || null}; }
$('card').onclick = async () => { if(!$('name').value || !$('email').value) return alert('Name and email, please.');
  const r = await j(API+'/order', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body())}); if(!r.ok) return $('out').innerHTML = `<p class="bad">${r.b.detail}</p>`;
  const o = r.b;
  if(o.test_mode){ const v = await j(API+'/verify', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({payment_id:o.payment_id, razorpay_order_id:o.order_id, razorpay_payment_id:'pay_test', razorpay_signature:'test'})});
    $('out').innerHTML = `<div class="card"><p class="ok">Test payment recorded (${o.payment_id}). ${qs.get('user')?'Your Quest tier has been upgraded.':''}</p><a href="/quest">Back to uniAI Quest</a></div>`; return; }
  const rz = new Razorpay({...o.checkout, handler: async resp => { const v = await j(API+'/verify', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({payment_id:o.payment_id, ...resp})});
    $('out').innerHTML = v.ok ? `<div class="card"><p class="ok">Payment successful. Reference ${o.payment_id}. A receipt is on its way to ${$('email').value}.</p><a href="/quest">Back to uniAI Quest</a></div>` : `<p class="bad">Verification failed: ${v.b.detail}</p>`; }});
  rz.open(); };
$('bank').onclick = async () => { if(!$('name').value || !$('email').value) return alert('Name and email, please.');
  const r = await j(API+'/bank-transfer', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body())}); if(!r.ok) return $('out').innerHTML = `<p class="bad">${r.b.detail}</p>`;
  const t = r.b.transfer_to; $('out').innerHTML = `<div class="card"><h3>Transfer ₹${r.b.amount_inr.toLocaleString('en-IN')} by NEFT / RTGS / IMPS</h3>
    <pre style="white-space:pre-wrap">${Object.entries(t).map(([k,v])=>`${k.replace('_',' ')}: ${v}`).join('\n')}</pre><p><b>Quote reference ${r.b.reference_to_quote} in the transfer remark.</b> Access is activated once the transfer is confirmed (usually same business day).</p></div>`; };
init();
</script></body></html>
