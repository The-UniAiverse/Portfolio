<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Services — uniAIverse</title><link rel="stylesheet" href="/assets/uav.css"><script src="/assets/nav.js" defer></script><script src="/assets/widget.js" defer></script></head>
<body><header><h1>AI services</h1><p class="hint">Assessment, consulting, delivery, workshops, training and a controlled platform. Prices come live from the engine; the same pages the website links to.</p></header>
<main><div id="list" class="card"><p class="hint">Loading…</p></div><div id="one"></div><div class="card"><h2>Success stories</h2><div id="stories" class="btngrid"></div><p class="hint" id="snote"></p></div></main>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const money=t=>t.price_inr!=null&&t.price_inr!==undefined&&t.price_inr!==0?'₹'+Number(t.price_inr).toLocaleString('en-IN'):t.price_usd?'$'+Number(t.price_usd).toLocaleString():'free';
async function load(){const s=await (await fetch('/api/site/services')).json();$('list').innerHTML='<div class="btngrid">'+s.services.map(x=>`<a href="#${x.id}" onclick="one('${x.id}')"><b>${esc(x.title)}</b><span>${esc(x.tagline)}</span><span style="display:block;margin-top:6px">${Object.entries(x.tiers).slice(0,4).map(([k,t])=>`<span class="badge ${k}">${k} ${money(t)}</span>`).join(' ')}</span></a>`).join('')+'</div>';
 const st=await (await fetch('/api/site/stories')).json();$('stories').innerHTML=st.stories.map(y=>`<a href="#${y.service}" onclick="one('${y.service}')"><b>${esc(y.metric)}</b><span>${esc(y.client)} · ${esc(y.industry)}</span><span style="display:block;margin-top:6px">${esc(y.result)}</span></a>`).join('');$('snote').textContent=st.note;if(location.hash)one(location.hash.slice(1));}
async function one(id){const r=await fetch('/api/site/services/'+id);if(!r.ok)return;const x=await r.json();$('one').innerHTML=`<div class="card"><h2>${esc(x.title)}</h2><p>${esc(x.tagline)}</p><div class="grid"><div><h3>For</h3><p>${x.for.map(esc).join(', ')}</p><h3>What you get</h3><ul>${x.what_you_get.map(v=>'<li>'+esc(v)+'</li>').join('')}</ul></div><div><h3>Use cases</h3><ul>${x.use_cases.map(v=>'<li>'+esc(v)+'</li>').join('')}</ul>${x.note?`<p class="hint">${esc(x.note)}</p>`:''}<p><a class="badge" style="background:var(--accent)" href="${x.page}">Open ${esc(x.page)}</a></p></div></div>
 <h3>Tiers</h3><div class="overflow"><table><tr><th>Tier</th><th>Price</th><th>Duration</th><th>Includes</th></tr>${Object.entries(x.tiers).map(([k,t])=>`<tr><td><span class="badge ${k}">${k}</span></td><td>${money(t)}</td><td>${esc(t.duration||'—')}</td><td>${(t.includes||t.features||[]).map(esc).join(' · ')}</td></tr>`).join('')}</table></div>
 ${x.stories.length?'<h3>Stories</h3>'+x.stories.map(y=>`<div class="okbox"><b>${esc(y.client)}</b> — ${esc(y.problem)} <br>${esc(y.what_we_did)} <br><b>${esc(y.result)}</b> <span class="hint">(${esc(y.status)})</span></div>`).join(''):''}</div>`;window.scrollTo({top:$('one').offsetTop-70,behavior:'smooth'})}
load();
</script></body></html>
