    - "S Are predictive maintenance and quality inspection use cases assessed with data availability?"
    - "G* Are AI systems interacting with physical equipment subject to safety assessment?"
    - "G Is edge / on-premise inference available where connectivity or latency demands it?"
    - "P Are digital twins or simulation environments used to test AI before physical deployment?"

