    - "S Are AI-assisted deliverables reviewed by qualified professionals before release?"
    - "G* Are engagement letters and client consents updated for AI use?"
    - "G Is professional liability for AI-assisted advice assessed with insurers and regulators?"
    - "P Are AI-enabled service lines (productised offerings) governed with quality standards?"
