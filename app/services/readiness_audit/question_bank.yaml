    - "S Is patient data handled under health-privacy rules (HIPAA, GDPR special category, local equivalents) in AI pipelines?"
    - "G* Are clinical AI tools assessed for medical-device regulation applicability?"
    - "G Is clinician oversight designed into every AI-supported clinical workflow?"
    - "P Are AI outputs validated against clinical outcomes with post-market surveillance?"
    - "P Is bias across patient populations tested and monitored?"

