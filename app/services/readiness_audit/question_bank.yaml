    - "G* Are explainability requirements for customer-affecting decisions met and documented?"
    - "G Is AI-driven customer communication compliant with conduct and fair-treatment rules?"
    - "P Are regulators' expectations on AI (local supervisory guidance) tracked and evidenced?"
    - "P Is AI used in trading, advice or underwriting subject to independent validation?"

