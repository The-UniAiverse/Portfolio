# AI Readiness Audit questionnaire.
# Edit freely: add/remove questions or dimensions; scoring adapts automatically.
# Every answer is 0–4. Labels give the respondent a concrete anchor for each score.

scale:
  0: "Not started / does not exist"
  1: "Ad hoc — isolated efforts, no ownership"
  2: "Defined — documented in places, inconsistently applied"
  3: "Managed — owned, measured, applied in most teams"
  4: "Optimised — embedded, continuously improved, best-in-class"

maturity_bands:
  - {min: 0,  max: 20,  level: "Nascent",     summary: "AI is a conversation, not a capability. Foundations are missing."}
  - {min: 21, max: 40,  level: "Emerging",    summary: "Pockets of experimentation exist; nothing repeatable or governed yet."}
  - {min: 41, max: 60,  level: "Developing",  summary: "Real pilots and some data discipline; scaling is blocked by gaps in people, process or governance."}
  - {min: 61, max: 80,  level: "Established", summary: "AI delivers measurable value in several functions; ready to industrialise."}
  - {min: 81, max: 100, level: "Leading",     summary: "AI is a core operating capability with governance, MLOps and skills at scale."}

dimensions:
  - id: strategy
    title: Strategy & Leadership
    weight: 0.20
    questions:
      - id: s1
        text: "Is there a written AI strategy linked to specific business objectives (revenue, cost, risk, customer)?"
      - id: s2
        text: "Does executive leadership sponsor AI with budget and named accountability?"
      - id: s3
        text: "Are AI use cases prioritised using value, feasibility and risk — not enthusiasm?"
      - id: s4
        text: "Is there a defined way to measure AI ROI and report it to leadership?"
      - id: s5
        text: "Is AI investment planned over multiple years rather than one-off pilots?"

  - id: data
    title: Data Foundations
    weight: 0.20
    questions:
      - id: d1
        text: "Is the data needed for your top use cases accessible without manual extraction?"
      - id: d2
        text: "Is data quality (completeness, accuracy, freshness) measured and owned?"
      - id: d3
        text: "Do you have a catalogue or clear map of what data exists and who owns it?"
      - id: d4
        text: "Are data pipelines automated and monitored rather than run by hand or spreadsheet?"
      - id: d5
        text: "Are access controls and data classification (confidential / internal / public) in place?"

  - id: technology
    title: Technology & Infrastructure
    weight: 0.15
    questions:
      - id: t1
        text: "Can teams provision compute, storage and model APIs in days, not months?"
      - id: t2
        text: "Are core systems (CRM, ERP, ticketing, docs) reachable through APIs?"
      - id: t3
        text: "Is there a standard, approved way to use LLMs / GenAI tools inside the company?"
      - id: t4
        text: "Do you have MLOps practices — versioning, monitoring, rollback — for models in production?"
      - id: t5
        text: "Is security review for AI tools and vendors defined and fast?"

  - id: people
    title: People & Skills
    weight: 0.15
    questions:
      - id: p1
        text: "Do business teams have basic AI literacy — what it can and cannot do?"
      - id: p2
        text: "Are there people who can build or configure AI solutions (in-house or partner)?"
      - id: p3
        text: "Is there a structured AI training / mentorship programme?"
      - id: p4
        text: "Are AI roles (product owner, data steward, model owner) defined?"
      - id: p5
        text: "Is there a community or forum where AI learnings are shared across teams?"

  - id: process
    title: Process & Operations
    weight: 0.15
    questions:
      - id: o1
        text: "Are candidate workflows for automation documented with volumes and time spent?"
      - id: o2
        text: "Is there a repeatable path from idea → pilot → production for AI use cases?"
      - id: o3
        text: "Are humans-in-the-loop and escalation paths defined for AI outputs?"
      - id: o4
        text: "Is change management (training, comms, adoption tracking) part of AI rollouts?"
      - id: o5
        text: "Do you measure adoption and outcomes after deployment, not just delivery?"

  - id: governance
    title: Governance, Risk & Compliance
    weight: 0.15
    questions:
      - id: g1
        text: "Is there an approved responsible-AI policy (privacy, fairness, transparency, safety)?"
      - id: g2
        text: "Are AI use cases risk-classified (e.g. EU AI Act tiers, internal risk levels)?"
      - id: g3
        text: "Is there a review checkpoint before an AI system reaches production?"
      - id: g4
        text: "Is there an inventory of all AI systems and third-party AI tools in use?"
      - id: g5
        text: "Are incident handling, monitoring and audit trails defined for AI systems?"
