# Work breakdown: likely (L) person-days per workstream per stage for the REFERENCE engagement
# (Silver depth · RAG pattern · 1 use case · 2 integrations · 3 data sources). The engine scales these — see engine.py estimate().
version: "1.0"
last_reviewed: "2026-09-21"
stages: [initiate, poc, mvp, production, scale]
stage_titles: {initiate: Initiate, poc: POC, mvp: Pilot / MVP, production: Production, scale: Scale}
stage_weeks: {initiate: [1, 3], poc: [2, 6], mvp: [6, 12], production: [8, 16], scale: [8, 16]}
accuracy: {initiate: "±50 to 100%", poc: "±25 to 50%", mvp: "±10 to 25%", production: "±5 to 15%", scale: "run-rate"}
commercial_model: {initiate: "Fixed fee or free discovery", poc: "Time and materials or fixed spike", mvp: "Capped T&M or milestone", production: "Fixed price or milestone", scale: "Milestone per increment"}
workstreams:
  - id: discovery
    title: Discovery and design
    scales_with: use_cases
    roles: {engagement_lead: 0.3, solution_architect: 0.5, ai_engineer: 0.2}
    days: {initiate: 6, poc: 3, mvp: 5, production: 4, scale: 3}
  - id: data
    title: Data engineering
    scales_with: data_sources
    roles: {data_engineer: 0.85, solution_architect: 0.15}
    days: {initiate: 1, poc: 6, mvp: 16, production: 14, scale: 8}
  - id: ai
    title: Model / AI lifecycle
    scales_with: use_cases_pattern
    roles: {ai_engineer: 0.8, qa_eval_engineer: 0.2}
    days: {initiate: 1, poc: 8, mvp: 18, production: 10, scale: 6}
  - id: app
    title: Application / software
    scales_with: integrations_pattern
    roles: {app_engineer: 0.85, solution_architect: 0.15}
    days: {initiate: 0, poc: 3, mvp: 16, production: 18, scale: 10}
  - id: mlops
    title: MLOps and deployment
    scales_with: integrations
    roles: {mlops_security_engineer: 0.9, app_engineer: 0.1}
    days: {initiate: 0, poc: 1, mvp: 6, production: 12, scale: 6}
  - id: security
    title: Security and compliance
    scales_with: risk
    roles: {mlops_security_engineer: 0.5, governance_specialist: 0.5}
    days: {initiate: 1, poc: 1, mvp: 4, production: 8, scale: 4}
  - id: pm
    title: Project management and governance
    scales_with: gate_formality
    roles: {engagement_lead: 0.7, change_lead: 0.3}
    days: {initiate: 2, poc: 3, mvp: 8, production: 10, scale: 6}
factors:
  tier_depth: {bronze: 0.6, silver: 1.0, gold: 1.5}          # documentation, governance and review depth
  gate_formality: {bronze: 0.7, silver: 1.0, gold: 1.6}
  risk: {minimal: 0.7, limited: 1.0, high: 1.8, prohibited: 1.0}
  per_extra_use_case: 0.6
  per_extra_integration: 0.15
  per_extra_data_source: 0.12
  min_integration_factor: 0.5
  min_data_source_factor: 0.4
  bronze_light_mvp: 0.6                                       # Bronze builds a light MVP, not a full pilot
  analogous_per_extra_use_case: 0.35
  analogous_tier: {bronze: 0.7, silver: 1.0, gold: 1.2}
  low_data_readiness: 1.3                                     # applied to data engineering when readiness < 40
  optimistic: 0.75
  pessimistic: {bronze: 1.5, silver: 1.6, gold: 1.8}
tshirt:                                                       # Bronze: person-day ranges per size (whole engagement scope)
  S: [0, 25]
  M: [25, 60]
  L: [60, 120]
  XL: [120, 100000]
analogous:                                                    # Gold cross-check: person-days to production, ONE use case, Silver depth, per pattern (replace with your actuals)
  assistant: 110
  rag: 190
  extraction: 175
  classical_ml: 210
  agent: 250
  multi_agent: 310
  note: "Placeholder reference values — replace with actuals after each engagement. Flag raised when PERT and analogous differ by more than 25%."
