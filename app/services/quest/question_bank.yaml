    - trends
    - interview
  - d: 2
    q: Model families now ship in tiers (e.g. small / mid / flagship). The right default for RAG answering is…
    options:
    - Flagship always
    - Mid-tier — retrieval did the hard part
    - Smallest always
    - Random
