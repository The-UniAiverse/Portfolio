version: '1.1'
last_reviewed: '2026-09-19'
topics:
- id: ai-basics
  title: AI Basics
  emoji: 🧠
  blurb: What AI actually is, minus the hype.
  questions:
  - d: 1
    q: An LLM is best described as…
    options:
    - A database of facts
    - A very good next-word predictor
    - A search engine
    - A rules engine
    answer: 1
    why: It's autocomplete that read the internet. No facts are 'stored' — which is exactly why it can be confidently wrong.
    tags:
    - fundamentals
  - d: 1
    q: A 'hallucination' is…
    options:
    - A bug that can be patched
    - A fluent, confident answer that is wrong
    - When the model refuses to answer
    - A rare edge case
    answer: 1
    why: Not a bug — the machine doing its job (produce plausible text) in a situation where that's the wrong job.
    tags:
    - fundamentals
    - safety
  - d: 1
    q: Which task is an LLM WORST at without tools?
    options:
    - Summarising an email
    - Translating a paragraph
    - Counting refunds in a spreadsheet
    - Rewriting in a friendlier tone
    answer: 2
    why: Counting needs a database or spreadsheet. Ask a librarian to count receipts and you'll get a confident, wrong total.
    tags:
    - limits
  - d: 2
    q: Machine learning differs from traditional programming because…
    options:
    - It needs no data
    - Rules are learned from examples instead of written by hand
    - It only works on images
    - It is always more accurate
    answer: 1
    why: 'You give examples and the machine finds the rules. Traditional code: you write the rules yourself.'
    tags:
    - fundamentals
  - d: 2
    q: Supervised learning needs…
    options:
    - Labelled examples
    - No data at all
    - A reward signal
    - A vector database
    answer: 0
    why: Supervised = someone already wrote the right answers on the cards. Reinforcement = a reward signal. Unsupervised = no labels.
    tags:
    - ml
  - d: 2
    q: Why does a mid-tier model with a good knowledge base often beat the best model with a bad one?
    options:
    - Bigger models are slower
    - The model isn't the bottleneck — the data is
    - Mid-tier models are trained longer
    - It doesn't; bigger always wins
    answer: 1
    why: Retrieval did the hard work. Feed a genius the wrong page and you get a well-written wrong answer.
    tags:
    - rag
    - strategy
  - d: 3
    q: A team says their AI is '70% accurate'. Your FIRST question should be…
    options:
    - Which model?
    - How big is the context window?
    - Accurate against what test set, and was the right information even retrieved?
    - How many GPUs?
    answer: 2
    why: No test set = no accuracy number. And most 'wrong answers' are retrieval failures, not model failures.
    tags:
    - evaluation
    - interview
  - d: 3
    q: Temperature 0 in an LLM call means…
    options:
    - Fastest response
    - Most deterministic sampling — pick the most likely tokens
    - Cheapest tokens
    - No hallucinations
    answer: 1
    why: Low temperature = boring and consistent. It does NOT stop hallucinations — a confident wrong answer at temperature 0 is still confident and wrong.
    tags:
    - parameters
  - d: 1
    q: Your phone's autocomplete and a frontier LLM share which family secret?
    options:
    - Both store a fact database
    - Both predict the next token
    - Both browse the web
    - Both are rule engines
    answer: 1
    why: Same trick, different scale. One read your texts; the other read the internet.
    tags:
    - fundamentals
  - d: 1
    q: The AI confidently invents a policy that doesn't exist. This is called…
    options:
    - A bug in the database
    - Hallucination
    - Overfitting
    - Latency
    answer: 1
    why: It isn't lying — it's autocompleting with nothing to go on.
    tags:
    - hallucination
  - d: 2
    q: Which task is an LLM WORST at out of the box?
    options:
    - Summarising a memo
    - Translating an email
    - Counting refunds in 500 rows
    - Drafting a polite reply
    answer: 2
    why: Counting needs a spreadsheet or SQL. The library can't add.
    tags:
    - limits
    - interview
  - d: 2
    q: '''Training'' vs ''inference'' — inference is…'
    options:
    - Teaching the model
    - Using the trained model to answer
    - Labelling data
    - Deleting the model
    answer: 1
    why: Training is school; inference is the exam it sits every time you ask.
    tags:
    - fundamentals
    - interview
  - d: 2
    q: What does 'context window' mean?
    options:
    - How long the model was trained
    - How much text it can consider at once
    - Its web browser
    - The GPU size
    answer: 1
    why: 'Think desk space: what fits on the desk is what it can read right now.'
    tags:
    - fundamentals
  - d: 3
    q: Why can a model that 'knows' more still answer a company-specific question wrong?
    options:
    - It has no access to your private data
    - It's too small
    - It's overconfident by design
    - It needs more GPUs
    answer: 0
    why: Knowledge ≠ access. Public training data never saw your handbook.
    tags:
    - interview
  - d: 3
    q: 'Interviewer: ''Explain AI to a CFO in one line.'' Best answer?'
    options:
    - It's a neural network with attention
    - Software that predicts and generates, and can be wrong confidently — so we design for verification
    - It thinks like a human
    - It's a database with a chat box
    answer: 1
    why: CFOs care about risk and control. Lead with the failure mode and the mitigation.
    tags:
    - interview
    - communication
  - d: 1
    q: Which one is NOT a good AI use case on day one?
    options:
    - Drafting first versions
    - Summarising long threads
    - Calculating quarterly totals
    - Translating support replies
    answer: 2
    why: Arithmetic goes to a calculator, not a poet.
    tags:
    - limits
- id: genai
  title: Generative AI
  emoji: 🎨
  blurb: Text, images, audio, video — and what can go wrong.
  questions:
  - d: 1
    q: Which is NOT generative AI?
    options:
    - Writing a product description
    - Generating an image from a prompt
    - Predicting whether a loan will default
    - Composing a jingle
    answer: 2
    why: Predicting default is classification — it decides, it doesn't create. Generative models produce new content.
    tags:
    - fundamentals
  - d: 1
    q: AI-generated marketing content should always be…
    options:
    - Published immediately to save time
    - Fact-checked and rights-checked before publishing
    - Posted without disclosure
    - Written by the most expensive model
    answer: 1
    why: The model can invent a statistic and a testimonial in the same paragraph. Check facts, check image rights, disclose where required.
    tags:
    - governance
    - marketing
  - d: 2
    q: Multimodal means the model can…
    options:
    - Run on multiple servers
    - Handle more than one type of input, e.g. text and images
    - Speak multiple languages
    - Use multiple prompts
    answer: 1
    why: Text + images + audio in one model. 'Read this chart and tell me what's wrong' is a multimodal ask.
    tags:
    - multimodal
  - d: 2
    q: 'Fine-tuning vs RAG: when is fine-tuning the better choice?'
    options:
    - When facts change daily
    - When you need a specific style, format or behaviour the base model doesn't have
    - When you need citations
    - Always — it's more accurate
    answer: 1
    why: RAG for knowledge (facts that change, need citing). Fine-tuning for behaviour (tone, format, domain style). Mixing them up is expensive.
    tags:
    - architecture
    - interview
  - d: 2
    q: Structured output (JSON schema mode) is useful because…
    options:
    - It's cheaper
    - Downstream code can rely on the shape without parsing prose
    - It stops hallucinations
    - It makes the model smarter
    answer: 1
    why: Ask for prose, get prose with surprises. Ask for a schema, get something your code can trust — and validate.
    tags:
    - engineering
  - d: 3
    q: A deepfake voice call asks your finance team to transfer money urgently. The best control is…
    options:
    - A better spam filter
    - An out-of-band verification rule for payment requests
    - Training the model to detect deepfakes
    - Banning voice calls
    answer: 1
    why: Process beats detection. 'Any payment request gets a callback on a known number' defeats the attack regardless of how good the fake is.
    tags:
    - security
    - governance
  - d: 3
    q: Provenance / watermarking of generated content matters most for…
    options:
    - Model speed
    - Trust, disclosure and regulatory compliance
    - Reducing token cost
    - Improving image quality
    answer: 1
    why: Regulators and platforms increasingly require disclosure. Provenance metadata (e.g. C2PA-style) is how you prove what's synthetic.
    tags:
    - governance
  - d: 1
    q: GenAI 'generates' means it…
    options:
    - Retrieves stored answers
    - Produces new text, images or code from patterns
    - Searches Google
    - Runs SQL
    answer: 1
    why: Generation is prediction with creativity turned on.
    tags:
    - fundamentals
  - d: 2
    q: Best first GenAI project for a company?
    options:
    - Everything at once
    - One narrow, high-volume, low-risk workflow
    - Replace the CFO
    - A humanoid robot
    answer: 1
    why: Narrow, measurable, boring. Boring ships.
    tags:
    - strategy
    - interview
  - d: 2
    q: '''Grounding'' an answer means…'
    options:
    - Making it sound humble
    - Forcing it to answer only from supplied documents
    - Lowering temperature
    - Adding emojis
    answer: 1
    why: Grounding turns a poet into a librarian.
    tags:
    - rag
  - d: 3
    q: Two documents in your knowledge base disagree. A good system should…
    options:
    - Pick one silently
    - Surface the conflict and cite both
    - Average them
    - Refuse forever
    answer: 1
    why: Silent picking is how you quote a policy from 2019.
    tags:
    - interview
    - design
  - d: 2
    q: Which output format is most reliable for downstream code?
    options:
    - Free prose
    - Structured JSON via schema
    - A poem
    - Markdown table
    answer: 1
    why: Schemas turn 'probably fine' into 'validated'.
    tags:
    - engineering
  - d: 3
    q: Temperature 0 vs 1 — what changes?
    options:
    - Cost
    - Randomness of token choice
    - Model size
    - Context length
    answer: 1
    why: Low temperature = same answer every time. Use it for facts, not brainstorming.
    tags:
    - fundamentals
    - interview
  - d: 1
    q: Which is a multimodal capability?
    options:
    - Reading a chart image and answering
    - Only writing text
    - Sorting a list
    - Sending email
    answer: 0
    why: Multimodal = more than one kind of input or output.
    tags:
    - trends
- id: llms
  title: LLMs Under the Hood
  emoji: ⚙️
  blurb: Context windows, attention, and the bits interviewers love.
  questions:
  - d: 1
    q: The 'context window' is…
    options:
    - How long the model was trained
    - How much text the model can consider at once
    - The number of users
    - The model's memory across sessions
    answer: 1
    why: It's the desk, not the library. Anything not on the desk right now doesn't exist for the model.
    tags:
    - fundamentals
  - d: 1
    q: Does an LLM remember your previous conversation by itself?
    options:
    - Yes, always
    - No — every request starts fresh unless history is sent again
    - Only on paid plans
    - Only if you say 'remember this'
    answer: 1
    why: No memory between calls. The app resends history (or a summary). That's also why long chats get expensive.
    tags:
    - fundamentals
    - cost
  - d: 2
    q: '''Lost in the middle'' refers to…'
    options:
    - Models forgetting mid-sentence
    - Weaker attention to information placed in the middle of a long context
    - Middle layers of the network
    - Mid-tier pricing
    answer: 1
    why: Put the most important evidence first and last. The middle of a 40-page prompt is where facts go to be ignored.
    tags:
    - context
    - rag
  - d: 2
    q: Transformers use 'attention' to…
    options:
    - Focus training on hard examples
    - Weigh how much each token should influence each other token
    - Reduce memory usage
    - Pick the temperature
    answer: 1
    why: Every token asks 'which other tokens matter to me?' That's why 'bank' near 'river' means something different from 'bank' near 'loan'.
    tags:
    - architecture
  - d: 2
    q: Open-weight models are attractive when…
    options:
    - You want zero ops
    - Data residency, cost at volume or fine-tuning control matter
    - You need the absolute best quality
    - You have no GPUs
    answer: 1
    why: You own the GPU and the ops — in exchange for control, residency and predictable cost at scale.
    tags:
    - strategy
    - model-selection
  - d: 3
    q: Embedding model version drift silently breaks retrieval because…
    options:
    - New models are slower
    - Queries embedded with a new model live in a different vector space than the index
    - Vectors expire
    - The database needs restarting
    answer: 1
    why: Same words, different coordinates. Recall collapses with no error message. Pin the version and store it in metadata.
    tags:
    - rag
    - mlops
    - interview
  - d: 3
    q: Reasoning-mode tokens are billed as…
    options:
    - Free
    - Input tokens
    - Output tokens — buy deliberately
    - A flat fee
    answer: 2
    why: Thinking costs output rates. Turn it on for hard problems, off for FAQ answering.
    tags:
    - cost
  - d: 1
    q: '''Open-weight'' model means…'
    options:
    - Free forever
    - The trained weights are downloadable and self-hostable
    - It weighs less
    - It has no parameters
    answer: 1
    why: You can run it in your own building. Ops cost is now yours too.
    tags:
    - fundamentals
  - d: 2
    q: Why pin a model version in production?
    options:
    - For style
    - Provider updates can silently change behaviour
    - It's cheaper
    - It's required by law
    answer: 1
    why: Same prompt, new model, different answer — and no error message.
    tags:
    - mlops
    - interview
  - d: 2
    q: What's 'model routing'?
    options:
    - Sending cheap questions to cheap models and hard ones to flagship models
    - Routing packets
    - Training on routes
    - A GPU setting
    answer: 0
    why: The single biggest cost lever most teams never pull.
    tags:
    - cost
    - interview
  - d: 3
    q: Reasoning models bill their 'thinking' as…
    options:
    - Free
    - Input tokens
    - Output tokens
    - Nothing, it's cached
    answer: 2
    why: Every thought costs. Buy reasoning deliberately.
    tags:
    - cost
    - trends
  - d: 3
    q: Fine-tuning vs RAG — pick fine-tuning when…
    options:
    - You need current facts
    - You need a consistent style or format the base model can't do
    - You have 20 documents
    - You want citations
    answer: 1
    why: RAG for knowledge, fine-tuning for behaviour. Most teams need RAG first.
    tags:
    - interview
    - design
  - d: 2
    q: A 'small language model' on-device is chosen for…
    options:
    - Maximum quality
    - Latency, privacy and cost
    - Marketing
    - Bigger context
    answer: 1
    why: Sometimes the best model is the one that never leaves the phone.
    tags:
    - trends
  - d: 1
    q: Which is NOT a way to access a model?
    options:
    - API
    - Chat app
    - Self-hosted open weights
    - Downloading its memories
    answer: 3
    why: Models don't have memories to download — that's the whole point of RAG.
    tags:
    - fundamentals
- id: tokens-cost
  title: Tokens & Cost
  emoji: 🪙
  blurb: The billing unit nobody explains — until it explodes.
  questions:
  - d: 1
    q: A token is roughly…
    options:
    - One character
    - Three-quarters of a word
    - One sentence
    - One page
    answer: 1
    why: 1,000 tokens ≈ 750 words ≈ 1.5 pages. A page ≈ 700 tokens. Like units on an electricity meter.
    tags:
    - cost
  - d: 1
    q: Output tokens typically cost… compared to input tokens
    options:
    - The same
    - About 5× more
    - Half
    - Nothing
    answer: 1
    why: Reading is cheap, writing is expensive. 'Answer in three sentences' is a cost control, not just a style choice.
    tags:
    - cost
  - d: 2
    q: Prompt caching saves the most when…
    options:
    - Prompts are random
    - The unchanging part of the prompt is placed first
    - You use the flagship model
    - You disable history
    answer: 1
    why: Static-first ordering lets the provider reuse the cached prefix — up to ~90% off that part. Put variable stuff at the bottom.
    tags:
    - cost
    - engineering
  - d: 2
    q: A chatbot's cost per message doubles over a long conversation because…
    options:
    - The model gets tired
    - History is resent every turn and grows
    - Output gets longer
    - Rate limits kick in
    answer: 1
    why: By message 40, 'the conversation so far' can be 50k tokens. Trim or summarise old messages.
    tags:
    - cost
  - d: 2
    q: A RAG assistant at 1,000 questions/day, 5 chunks, mid-tier model costs roughly…
    options:
    - $5/month
    - $300–800/month
    - $10,000/month
    - $0 — it's cached
    answer: 1
    why: ~5,100 input + 400 output tokens per question ≈ $0.014–0.02. Times 30,000 questions ≈ $400–600. Far less than people fear.
    tags:
    - cost
    - estimation
  - d: 3
    q: The biggest saver when adding agents is…
    options:
    - A bigger context window
    - 'Routing: only complex questions go to the agent loop'
    - Lower temperature
    - Removing citations
    answer: 1
    why: Sorted by type ≈ 56% cheaper than all-agentic, with agent quality where it matters. Don't put every question in the expensive vehicle.
    tags:
    - cost
    - agents
    - interview
  - d: 3
    q: Non-English content typically costs…
    options:
    - Less
    - The same
    - 2–5× more tokens for the same information
    - Only more on images
    answer: 2
    why: Tokenisers are English-optimised. Budget it, and test quality with real content before committing.
    tags:
    - cost
    - multilingual
  - d: 1
    q: One page of text is roughly how many tokens?
    options:
    - '70'
    - '700'
    - 7,000
    - 70,000
    answer: 1
    why: ~700 tokens. Memorise it; it's the unit of your bill.
    tags:
    - cost
  - d: 2
    q: Output tokens usually cost about ___ input tokens.
    options:
    - The same as
    - 5× more than
    - Half of
    - 100× more than
    answer: 1
    why: Reading is cheap. Writing is expensive. Keep answers short.
    tags:
    - cost
    - interview
  - d: 2
    q: Prompt caching saves money when…
    options:
    - Every prompt is different
    - A long static prefix repeats across requests
    - You use temperature 1
    - You stream
    answer: 1
    why: Put the unchanging part first. Up to ~90% off that part.
    tags:
    - cost
    - engineering
  - d: 3
    q: Chat history grows every turn. The hidden cost explosion is fixed by…
    options:
    - A bigger model
    - Trimming or summarising old messages
    - More GPUs
    - Shorter system prompt
    answer: 1
    why: By message 40 you're paying for 39 messages you didn't need.
    tags:
    - cost
    - interview
  - d: 2
    q: 'A RAG bot: 1,000 tokens system + 2,500 context + 100 question, 400 answer, at $2/M in and $10/M out. Cost per question?'
    options:
    - ~$0.001
    - ~$0.011
    - ~$0.11
    - ~$1.10
    answer: 1
    why: (3,600×2 + 400×10)/1M ≈ $0.0112. That's the whiteboard question.
    tags:
    - cost
    - interview
  - d: 3
    q: Batch API typically gives…
    options:
    - 10% off
    - 50% off, with delayed results
    - Free tokens
    - Faster answers
    answer: 1
    why: If it can wait an hour, it can cost half.
    tags:
    - cost
  - d: 1
    q: Non-English text costs…
    options:
    - The same
    - Usually 2-5× more tokens for the same content
    - Less
    - Nothing
    answer: 1
    why: Tokenizers were raised on English. Budget accordingly.
    tags:
    - cost
- id: prompt-engineering
  title: Prompt Engineering
  emoji: ✍️
  blurb: What actually moves the needle — and what's internet folklore.
  questions:
  - d: 1
    q: Which instruction is strongest?
    options:
    - Don't be verbose
    - Be thorough but brief
    - Answer in at most three sentences
    - Please be concise, thank you
    answer: 2
    why: State the target, don't forbid the opposite. 'Thorough but brief' is a contradiction; 'three sentences' is a spec.
    tags:
    - prompting
  - d: 1
    q: '''I''ll tip you $200 if you get this right'' …'
    options:
    - Improves accuracy significantly
    - Is internet folklore — describe the output shape instead
    - Reduces cost
    - Enables reasoning mode
    answer: 1
    why: Describe the output, not the personality. Format, length, what to do when unsure — those work.
    tags:
    - prompting
  - d: 2
    q: The single most valuable line in a RAG prompt is…
    options:
    - You are a world-class expert
    - Answer only from the provided documents; if not there, say so
    - Be creative
    - Use markdown
    answer: 1
    why: It turns a lie into a report. 'I could not find this' becomes a countable metric of library quality.
    tags:
    - rag
    - prompting
  - d: 2
    q: Few-shot examples help most when…
    options:
    - The task is simple
    - The desired format or judgement is hard to describe but easy to show
    - You want shorter answers
    - The model is small
    answer: 1
    why: Show, don't tell — for formats, edge cases and 'this good / this bad' distinctions.
    tags:
    - prompting
  - d: 2
    q: Prompts should be…
    options:
    - Rewritten by each person
    - Version-controlled and tested like code
    - Kept secret
    - As short as possible
    answer: 1
    why: A prompt change is a production change. Golden set, regression test, then ship.
    tags:
    - engineering
    - evaluation
  - d: 3
    q: Indirect prompt injection is when…
    options:
    - A user types 'ignore previous instructions'
    - Malicious instructions arrive inside retrieved content (a PDF, a web page, an email)
    - The system prompt leaks
    - Two prompts conflict
    answer: 1
    why: You deliberately feed untrusted documents to an instruction-follower. Hidden white text in a PDF is the attack surface. Delimit, strip, least-privilege tools.
    tags:
    - security
    - interview
  - d: 3
    q: Step-back prompting means…
    options:
    - Reducing max tokens
    - Asking a broader conceptual question first, then the specific one
    - Restarting the conversation
    - Lowering temperature
    answer: 1
    why: Grounding in the general principle first improves reasoning-heavy answers. Costs one extra call.
    tags:
    - prompting
    - reasoning
  - d: 1
    q: Which prompt line actually improves output?
    options:
    - '''You are a world-class expert'''
    - '''Answer in at most three sentences and cite the section'''
    - '''Please please please'''
    - '''I''ll tip $200'''
    answer: 1
    why: Describe the output, not the personality.
    tags:
    - prompting
  - d: 2
    q: '''Be thorough but brief'' is bad because…'
    options:
    - It's rude
    - It's a contradiction — pick one and give a number
    - Models hate adjectives
    - It's too short
    answer: 1
    why: State the target, don't forbid the opposite.
    tags:
    - prompting
    - interview
  - d: 2
    q: Few-shot prompting means…
    options:
    - Asking few questions
    - Showing examples of the desired output
    - Using a small model
    - Short prompts
    answer: 1
    why: Show, don't tell. Three good examples beat three paragraphs of instructions.
    tags:
    - prompting
  - d: 3
    q: System prompt vs user prompt — the system prompt should hold…
    options:
    - The user's question
    - Stable rules, format and persona
    - Today's news
    - The retrieved documents
    answer: 1
    why: Stable at the top (cacheable), changing at the bottom.
    tags:
    - prompting
    - cost
  - d: 3
    q: The single most valuable line in a RAG prompt?
    options:
    - '''Be creative'''
    - '''Answer only from the documents; if not found, say so'''
    - '''Use bullet points'''
    - '''You are helpful'''
    answer: 1
    why: It turns a lie into a report — and a report into a metric.
    tags:
    - rag
    - interview
  - d: 2
    q: Prompt injection is…
    options:
    - A syringe
    - Untrusted content that instructs the model to misbehave
    - A prompt library
    - Fine-tuning
    answer: 1
    why: Your PDF just told the model to email its secrets. Treat content as data, not commands.
    tags:
    - security
    - interview
  - d: 1
    q: Prefilling the response with '{' does what?
    options:
    - Nothing
    - Forces JSON and skips preamble
    - Adds a bracket
    - Breaks the model
    answer: 1
    why: Start the answer for it; it will follow the shape.
    tags:
    - prompting
- id: rag
  title: RAG Systems
  emoji: 📚
  blurb: 'The company library: parsing, chunking, search, rerank.'
  questions:
  - d: 1
    q: RAG stands for…
    options:
    - Random Answer Generation
    - Retrieval-Augmented Generation
    - Recursive Agent Graph
    - Rapid AI Guidance
    answer: 1
    why: Fetch the right pages first, then answer. That's the whole idea.
    tags:
    - fundamentals
  - d: 1
    q: Why not paste the whole 500-page handbook into every request?
    options:
    - It's illegal
    - Cost, latency, worse accuracy, and no permission control
    - Models can't read that much
    - It's fine — do it
    answer: 1
    why: ~$20k/month vs ~$300/month, and the answers get worse because the one right paragraph is buried.
    tags:
    - cost
    - architecture
  - d: 2
    q: Which chunking strategy is the best default for enterprise documents?
    options:
    - Fixed 500 characters
    - Structure-aware (headings/sections) with a contextual prefix
    - One chunk per document
    - Random sampling
    answer: 1
    why: Cut where the author cut. Then prepend one sentence saying where the chunk came from — the cheapest large accuracy gain there is.
    tags:
    - chunking
  - d: 2
    q: Hybrid search combines…
    options:
    - Two LLMs
    - Semantic (vector) search and keyword (BM25) search
    - Two vector databases
    - Search and caching
    answer: 1
    why: Vectors find 'money back' when you say 'refund'. Keywords find 'ERR_SVC_4471'. You need both; fuse with RRF.
    tags:
    - retrieval
  - d: 2
    q: The highest-ROI single addition to a working RAG system is usually…
    options:
    - A bigger model
    - A cross-encoder reranker
    - More chunks
    - A longer system prompt
    answer: 1
    why: +10–25 nDCG, one afternoon, fractions of a cent per query. If someone says 'our RAG is 70% right', try this first.
    tags:
    - reranking
    - interview
  - d: 3
    q: Reciprocal Rank Fusion works on…
    options:
    - Scores
    - Ranks — because cosine 0.87 and BM25 14.3 aren't comparable
    - Embeddings
    - Token counts
    answer: 1
    why: 'Agreement is evidence: if two methods both rank a card high, it probably matters. Ranks are always comparable; scores aren''t.'
    tags:
    - retrieval
    - interview
  - d: 3
    q: A late-binding ACL filter (filter after retrieval) is dangerous because…
    options:
    - It's slow
    - It can return empty results and leaks via citations
    - It needs a GPU
    - It breaks caching
    answer: 1
    why: Pre-filter in the ANN search, re-check at assembly, and filter citation metadata too — a document title the user can't open is itself a disclosure.
    tags:
    - security
    - rag
  - d: 3
    q: 'Your bot answers a follow-up ''what about contractors?'' badly. Most likely fix:'
    options:
    - Bigger model
    - Query rewriting from conversation history
    - More overlap
    - Lower temperature
    answer: 1
    why: '''What about contractors'' alone retrieves garbage. Rewrite to ''leave policy for contractors'' first. The #1 chat-RAG bug.'
    tags:
    - query-understanding
  - d: 1
    q: 'RAG in five words:'
    options:
    - Retrieve first, then generate answer
    - Train a new model
    - Search Google faster
    - Replace the database
    answer: 0
    why: Fetch the right pages, put them on the desk, then write.
    tags:
    - fundamentals
  - d: 2
    q: Most wrong RAG answers are caused by…
    options:
    - The model being dumb
    - The right chunk never being retrieved
    - Bad grammar
    - Temperature
    answer: 1
    why: Look at what was retrieved before blaming the AI. Nine times out of ten.
    tags:
    - debugging
    - interview
  - d: 3
    q: Reranking is worth it because…
    options:
    - It's free
    - A cross-encoder reading 50 candidates picks better than the vector index alone — typically +10-25% quality
    - It replaces embeddings
    - It's faster
    answer: 1
    why: Filter 500 → 50 cheaply, read 50 → 5 carefully. That's hiring, and that's reranking.
    tags:
    - retrieval
    - interview
  - d: 3
    q: '''Contextual chunking'' adds…'
    options:
    - More chunks
    - A one-line 'this is from…' prefix to each chunk before embedding
    - Random noise
    - A summary of the corpus
    answer: 1
    why: Cheapest big accuracy gain available. Turn it on.
    tags:
    - chunking
  - d: 2
    q: Never split a…
    options:
    - Paragraph
    - Table
    - Sentence
    - Heading
    answer: 1
    why: A table cut in half is two lies.
    tags:
    - chunking
  - d: 3
    q: 'The ''not'' problem: embeddings struggle with…'
    options:
    - Long text
    - Negation, codes and numbers
    - Synonyms
    - Questions
    answer: 1
    why: '''Terminated'' and ''NOT terminated'' embed almost identically. Keyword search rescues you.'
    tags:
    - retrieval
    - interview
  - d: 2
    q: Deleting a document from the library must also…
    options:
    - Do nothing
    - Remove its chunks from the index and caches
    - Retrain the model
    - Email legal
    answer: 1
    why: Old cards survive. Then your bot quotes a policy that no longer exists.
    tags:
    - freshness
  - d: 3
    q: 'Agentic RAG vs a good Advanced RAG for FAQ traffic:'
    options:
    - Agentic always wins
    - 'Advanced: faster, ~30× cheaper, same answer'
    - They're equal
    - Agentic is free
    answer: 1
    why: An agent doesn't fix bad retrieval — it repeats it five times.
    tags:
    - architecture
    - interview
- id: agents
  title: AI Agents
  emoji: 🤖
  blurb: Loops, tools, budgets — and when NOT to.
  questions:
  - d: 1
    q: An AI agent differs from a chatbot because it…
    options:
    - Is bigger
    - Decides what to do next, uses tools, and can try again
    - Has no prompt
    - Runs offline
    answer: 1
    why: 'Chatbot = vending machine: one button, one item. Agent = a librarian who goes back to the shelves.'
    tags:
    - fundamentals
  - d: 2
    q: An agent does NOT fix bad retrieval — it…
    options:
    - Ignores it
    - Repeats it, five times, at five times the cost
    - Fixes it automatically
    - Switches to a bigger model
    answer: 1
    why: Earn your way up. The most expensive mistake in this field is going agentic when the defect was in chunking.
    tags:
    - architecture
    - interview
  - d: 2
    q: Which safety rail is NOT optional for an agent loop?
    options:
    - A fancy UI
    - Max iterations, max cost, max time and a required give-up path
    - Multiple agents
    - A vector DB
    answer: 1
    why: Without caps, one badly worded question loops for 20 minutes and costs more than your month. Denial-of-wallet is real.
    tags:
    - safety
  - d: 2
    q: MCP (Model Context Protocol) is…
    options:
    - A new model
    - A standard interface for giving agents tools and data
    - A pricing tier
    - A prompt format
    answer: 1
    why: One plug shape for tools. Vet third-party servers like any dependency — least privilege applies.
    tags:
    - tools
  - d: 3
    q: Twenty tools in an agent's registry costs roughly…
    options:
    - Nothing
    - ~5,000 input tokens on every single call
    - One extra second
    - One GPU
    answer: 1
    why: Tool definitions ride along on every call. Prune per route or use lazy tool search.
    tags:
    - cost
    - tools
    - interview
  - d: 3
    q: A write-capable agent with broad permissions is…
    options:
    - Efficient
    - An incident waiting to happen — gate destructive actions behind human confirmation
    - Best practice
    - Required for RAG
    answer: 1
    why: 'Blast radius = the permissions of the tools it can call. Read-only agent: a nuisance. Write-capable: an incident.'
    tags:
    - security
  - d: 3
    q: Use the smallest agent topology that works because multi-agent systems…
    options:
    - Are always better
    - Have the coordination and cost-attribution problems microservices had in 2016
    - Are cheaper
    - Need no evaluation
    answer: 1
    why: Single agent + tools first. Most tasks never need a supervisor, workers and a debate club.
    tags:
    - architecture
  - d: 1
    q: An agent differs from a chatbot because it…
    options:
    - Talks more
    - Decides which tools to call and can loop until done
    - Is cheaper
    - Never errs
    answer: 1
    why: Vending machine vs librarian who goes back to the shelf.
    tags:
    - fundamentals
  - d: 2
    q: Every agent loop needs which safety rail?
    options:
    - A logo
    - Max iterations, cost cap, timeout and a give-up path
    - More tools
    - A bigger model
    answer: 1
    why: Without a limit, one bad question loops for twenty minutes.
    tags:
    - safety
    - interview
  - d: 3
    q: 20 tool definitions in every call cost about…
    options:
    - Nothing
    - ~5,000 input tokens per call
    - 1 token
    - One GPU
    answer: 1
    why: Prune tools per route or load them lazily.
    tags:
    - cost
    - interview
  - d: 2
    q: When is agentic NOT worth it?
    options:
    - Multi-step research
    - Simple, high-volume questions where speed matters
    - Vague questions
    - Cross-system tasks
    answer: 1
    why: Sort your questions first. Send only the complex ones down the expensive road.
    tags:
    - architecture
  - d: 3
    q: 'Interviewer: ''Design a support agent.'' The first thing you mention?'
    options:
    - The model name
    - Scope, tools with least privilege, human handoff and evals
    - The UI colours
    - Vector DB choice
    answer: 1
    why: Boundaries before brilliance.
    tags:
    - interview
    - design
  - d: 2
    q: '''Computer-use'' agents are risky mainly because…'
    options:
    - They're slow
    - They act on real UIs where mistakes have side effects
    - They're expensive
    - They need Windows
    answer: 1
    why: Clicking 'delete' is not a hallucination you can undo.
    tags:
    - trends
    - safety
- id: mlops
  title: MLOps & Production
  emoji: 🚀
  blurb: Shipping is the easy part. Keeping it working is the job.
  questions:
  - d: 1
    q: A bot without a test sheet is…
    options:
    - A system
    - A demo
    - Production-ready
    - Cheap
    answer: 1
    why: '''It feels better'' isn''t measurement. Change one thing, re-run the whole sheet, record the score.'
    tags:
    - evaluation
  - d: 2
    q: Recall@20 measures…
    options:
    - How fast retrieval is
    - The share of relevant chunks found in the top 20
    - Answer length
    - Cost per query
    answer: 1
    why: Recall is unrecoverable downstream; precision is fixable by reranking. Target > 0.9 before reranking.
    tags:
    - evaluation
    - interview
  - d: 2
    q: Blue/green index versioning lets you…
    options:
    - Use two colours in the UI
    - Roll back an embedding-model change that degraded quality
    - Halve storage
    - Skip evaluation
    answer: 1
    why: Index changes done in place have no undo. Two indexes, switch traffic, keep the old one until the new one proves itself.
    tags:
    - mlops
  - d: 2
    q: 'Log per request, without exception:'
    options:
    - Only errors
    - Model, tokens (in/out/cached), latency per stage, retrieved chunk IDs and scores, cost
    - Just the user's question
    - Nothing — privacy
    answer: 1
    why: Without the trace, RAG is undebuggable. With it, most bugs are obvious in thirty seconds.
    tags:
    - observability
  - d: 3
    q: LLM-as-judge needs…
    options:
    - The biggest model
    - Calibration against human labels and awareness of position/verbosity bias
    - No rubric
    - A temperature of 1
    answer: 1
    why: Label 50 items by hand, measure agreement, fix the rubric — then trust the number. Randomise order; use a different model family as judge.
    tags:
    - evaluation
    - interview
  - d: 3
    q: Deletion propagation matters because…
    options:
    - Storage is expensive
    - A deleted policy can survive in chunks, vectors, caches and logs — and get quoted
    - It speeds up search
    - Regulators like tidy data
    answer: 1
    why: '''Your assistant quoted a retracted policy'' is a compliance incident, not a bug. Design the delete path on day one.'
    tags:
    - governance
    - mlops
  - d: 1
    q: MLOps is basically…
    options:
    - Marketing
    - 'DevOps for models: version, deploy, monitor, roll back'
    - Buying GPUs
    - Data entry
    answer: 1
    why: If you can't roll back, you don't have a system — you have a hope.
    tags:
    - fundamentals
  - d: 2
    q: Drift means…
    options:
    - The model moved servers
    - Data or behaviour changed after deployment
    - A typo
    - Latency
    answer: 1
    why: The world changed; the model didn't. Monitor for it.
    tags:
    - monitoring
    - interview
  - d: 2
    q: A golden set is…
    options:
    - A trophy
    - A versioned test set of real questions with expected answers, run on every change
    - Training data
    - A prompt
    answer: 1
    why: A bot without a test sheet is a demo, not a system.
    tags:
    - evaluation
    - interview
  - d: 3
    q: LLM-as-judge is safe to use after…
    options:
    - Never
    - Calibrating it against human ratings on a sample
    - Choosing GPT
    - Setting temperature 0
    answer: 1
    why: 'Judges have biases: position, verbosity, self-preference. Check before trusting.'
    tags:
    - evaluation
  - d: 3
    q: Blue/green index deployment lets you…
    options:
    - Save money
    - Roll back an embedding-model change instantly
    - Skip testing
    - Delete data
    answer: 1
    why: Re-embedding 10M chunks is a project. Keep the old index until the new one proves itself.
    tags:
    - mlops
  - d: 2
    q: What must you log per LLM request to debug a wrong answer?
    options:
    - Just the answer
    - Query, retrieved chunk IDs, prompt, tokens, cost
    - Nothing
    - User's name
    answer: 1
    why: Without the trace, RAG is undebuggable. With it, most bugs take thirty seconds.
    tags:
    - observability
    - interview
- id: ai-ethics
  title: Governance, Ethics & Regulation
  emoji: ⚖️
  blurb: EU AI Act, NIST, ISO 42001 — decoded.
  questions:
  - d: 1
    q: The first thing regulators usually ask for is…
    options:
    - Your model weights
    - An inventory of AI systems in use
    - Your prompts
    - Your GPU bill
    answer: 1
    why: You cannot govern what you haven't listed. System, owner, purpose, data used, people affected.
    tags:
    - governance
  - d: 1
    q: Telling users they are talking to an AI is…
    options:
    - Optional
    - A transparency obligation in many regimes (limited-risk tier)
    - Bad for conversion
    - Only for chatbots in Europe
    answer: 1
    why: Disclosure is cheap and increasingly mandatory. Trust goes up, not down.
    tags:
    - regulation
  - d: 2
    q: Under EU AI Act-style tiers, CV screening for hiring is typically…
    options:
    - Minimal risk
    - High risk — employment affects individuals' rights
    - Prohibited
    - Unregulated
    answer: 1
    why: 'Employment, credit, education, access to services → high-risk controls: documentation, human oversight, bias testing, monitoring.'
    tags:
    - regulation
    - interview
  - d: 2
    q: NIST AI RMF is…
    options:
    - A law
    - A voluntary risk-management framework (Govern, Map, Measure, Manage)
    - A certification
    - A model
    answer: 1
    why: Adopt one voluntarily before procurement demands it. ISO/IEC 42001 is the certifiable management-system standard.
    tags:
    - frameworks
  - d: 2
    q: Two policies in the knowledge base disagree. The system should…
    options:
    - Pick the newer one silently
    - Surface the conflict, and the library should carry version flags so current wins
    - Refuse entirely
    - Average them
    answer: 1
    why: Silent picking is a real risk. Keep only approved current versions; mark dates; surface conflicts when they remain.
    tags:
    - governance
    - rag
  - d: 3
    q: '''Denial of wallet'' is…'
    options:
    - A refused payment
    - An attack or accident that runs up inference cost (loops, huge inputs) — mitigated by hard caps
    - A GDPR term
    - A caching bug
    answer: 1
    why: Max iterations, tokens, wall-clock, per-user rate limits, cost ceiling per request. Every one, every time.
    tags:
    - security
    - cost
  - d: 3
    q: Human oversight should be…
    options:
    - Always a full manual review
    - 'Proportionate to risk: approval, sampling, or monitoring depending on impact'
    - Removed once accuracy > 90%
    - Only for images
    answer: 1
    why: A refund-policy bot needs monitoring. A credit decision needs an approver with the power to override.
    tags:
    - governance
  - d: 1
    q: A 'high-risk' AI use case under EU AI Act-style rules is…
    options:
    - A poem generator
    - CV screening for hiring
    - A recipe bot
    - Autocomplete
    answer: 1
    why: Anything affecting people's rights, jobs, credit or safety gets the heavy controls.
    tags:
    - regulation
  - d: 2
    q: Your knowledge bot can see HR salary files. The control is…
    options:
    - Politeness
    - Permission filtering inside retrieval, not after
    - A disclaimer
    - A smaller model
    answer: 1
    why: Filtering after retrieval leaks via citations. Pre-filter.
    tags:
    - security
    - interview
  - d: 2
    q: Disclosure means…
    options:
    - Hiding AI use
    - Telling users they're interacting with AI or AI-generated content
    - Open-sourcing
    - Logging
    answer: 1
    why: Trust survives disclosure. It doesn't survive discovery.
    tags:
    - governance
  - d: 3
    q: NIST AI RMF's four functions are…
    options:
    - Plan, Do, Check, Act
    - Govern, Map, Measure, Manage
    - Build, Ship, Sell, Repeat
    - Train, Test, Deploy, Forget
    answer: 1
    why: Govern sits in the middle of everything.
    tags:
    - regulation
    - interview
  - d: 3
    q: Two AI vendors, one trains on your data and one doesn't. The right question is…
    options:
    - Which is cheaper
    - Where is the contractual guarantee and can we audit it
    - Which has a nicer UI
    - Which is newer
    answer: 1
    why: Read the data-use clause before the feature list.
    tags:
    - governance
    - interview
  - d: 2
    q: '''Human in the loop'' should be designed…'
    options:
    - Everywhere equally
    - Proportionate to risk — approval, sampling or monitoring
    - Never
    - Only in demos
    answer: 1
    why: Approve the loan; sample the summaries; monitor the autocomplete.
    tags:
    - governance
  - d: 1
    q: AI inventory is the first thing regulators and clients ask for because…
    options:
    - It's easy
    - You cannot govern what you haven't listed
    - It's fun
    - It's optional
    answer: 1
    why: List it before you're asked to.
    tags:
    - governance
- id: new-models
  title: New Models & What's Next
  emoji: 🚀
  blurb: Frontier models, model families, and how to evaluate what's new — updated via the admin-approved news pipeline.
  questions:
  - d: 1
