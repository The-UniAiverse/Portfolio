stories:
  - id: acme-shipment-assistant
    client: Acme Logistics (illustrative)
    industry: Logistics
    service: delivery
    problem: 11 minutes per "where is my shipment" email, 900 a week.
    what_we_did: Silver engagement; grounded assistant on tracking data and 14 policy documents; agents review every draft.
    result: Median handling time 11 → 5.5 min in 90 days; 14/14 on the evaluation set; run cost under $60 a month.
    metric: "-50% handling time"
    status: illustrative                    # replace with a real case study before publishing (Master Playbook §31)
  - id: kaveri-governance
    client: Kaveri Pharma (illustrative)
    industry: Pharma
    service: consulting
    problem: 15 AI systems, no inventory, a high-risk CV screener without sign-off.
    what_we_did: Inventory and classification with the governance engine; review board designed; 30-day plan.
    result: Inventory complete, 2 high-risk systems under sign-off control, board metrics quarterly.
    metric: "15 systems classified"
    status: illustrative
  - id: zenith-readiness
    client: Zenith Foods (illustrative)
    industry: FMCG
    service: readiness
    problem: Board asked "are we ready?" before a ₹40 lakh pilot.
    what_we_did: Free snapshot then Silver audit; data and governance flagged as the two weakest domains.
    result: Pilot re-scoped to a Bronze delivery with a data sprint first; budget kept.
    metric: "score 41 → 63 in 6 months"
    status: illustrative
  - id: college-workshop-2026
    client: Engineering college, Pune (illustrative)
    industry: Education
    service: workshops
    problem: Students knew the words, could not ship anything.
    what_we_did: College edition of the Agentic AI workshop; every team deployed a RAG bot on college documents.
    result: 42 of 48 students deployed; 9 joined the student cohort.
    metric: "42 deployments in a day"
    status: illustrative
