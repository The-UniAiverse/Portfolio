# ── Foundation ────────────────────────────────────────────────────────────────
- id: ai-for-all
  title: AI for All
  version: "2.0"
  status: active
  level: 1
  owner: Sarfi
  last_reviewed: "2026-09-12"
  audience: Everyone — no technical background
  hours: 4
  formats: [workshop, self_paced]
  tiers: [bronze, silver, gold, platinum]
  prerequisites: []
  certification: aware
  outcomes:
    - Explain in plain words how an LLM works and why it makes things up
    - Use AI tools safely — know what data may and may not be shared
    - Write prompts that get reliable results for everyday tasks
    - Verify AI output before relying on it
  modules:
    - {title: "The 10-minute win", hours: 0.5, topics: [real task with an AI tool, what worked and what didn't], lab: "Rewrite, summarise, translate a real document"}
    - {title: "How it actually works", hours: 0.75, topics: [autocomplete on steroids, no database inside, hallucination, tokens, context window], lab: "Confident wrong answer demo"}
    - {title: "What AI is good and bad at", hours: 0.5, topics: [drafting, summarising, translating, brainstorming vs counting, facts, recent events, reasoning limits], lab: "Sort 20 tasks into AI-suitable / not"}
    - {title: "Prompting that works", hours: 0.75, topics: [context, format, examples, iteration, what doesn't work], lab: "Before/after on the same task"}
    - {title: "Safety and data", hours: 0.5, topics: [data classification, disclosure, IP, deepfakes and scams], lab: "The salary-leak case"}
    - {title: "Automate one weekly task", hours: 0.75, topics: [personal workflow, saved prompts, checking outputs], lab: "Build and show one automation"}
    - {title: "Close: the 5 rules", hours: 0.25, topics: [verify, protect data, be specific, give context, own the output], lab: null}
  assessment: "Quiz (15 questions) + one submitted prompt/output with verification notes"
