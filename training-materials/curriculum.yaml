# uniAIverse Academy — Curriculum Framework v2.0
# ─────────────────────────────────────────────────────────────────────────────
# Governance: every course has an owner, version, status, last_reviewed and review cadence.
# Amend by editing this file; the API, website, proposals and tests read it. Record changes in CHANGELOG.md.
# Status: active | draft | retired.   Level: 1 foundation · 2 practitioner · 3 advanced · 4 expert
# Tier availability: which service tiers include this course (see pricing/tiers.yaml → training).
# ─────────────────────────────────────────────────────────────────────────────

version: "2.0"
last_reviewed: "2026-09-12"
review_cadence: quarterly
governance:
  curriculum_owner: Sarfi
  change_process: "Propose in CHANGELOG.md → review by curriculum owner → bump course version → update last_reviewed"
  retirement_rule: "Any course not reviewed in 2 quarters is flagged 'stale' by the API"
  quality_bar:
    - Every module has learning objectives, a lab or exercise, and an assessment
    - Every technical course has a capstone with a Definition of Done
    - Tool names are verified before each delivery (AI tooling changes monthly)
    - Materials are versioned; slides, labs and handouts live in the course folder

delivery_formats:
  workshop: "Half-day or full-day, live, up to 20 people"
  cohort: "Multi-week, live sessions + labs + mentorship office hours"
  self_paced: "Recorded modules + labs + async Q&A"
  executive_briefing: "90-120 minutes for leadership / board"
  train_the_trainer: "Enable client staff to deliver internally"

certification_levels:
  - {id: aware,        title: "AI Aware",        requires: "Attendance + quiz ≥ 70%"}
  - {id: practitioner, title: "AI Practitioner", requires: "Labs completed + capstone reviewed"}
  - {id: professional, title: "AI Professional", requires: "Capstone meets Definition of Done + peer review"}
  - {id: expert,       title: "AI Expert",       requires: "Professional + delivered one client-grade project"}

# ═════════════════════════════════════════════════════════════════════════════
tracks:
  - id: everyone
    title: AI for All
    audience: Every employee
    courses: [ai-for-all, ai-safe-use, ai-productivity]
  - id: business
    title: AI for Business
    audience: Managers, analysts, function heads
    courses: [ai-for-all, ai-for-business, agentic-ai-workshop, llm-cost, ai-use-case-design, rag-nontechnical]
  - id: leadership
    title: AI Leadership & Board
    audience: CXOs, board members, founders
    courses: [ai-executive-briefing, agentic-ai-workshop, ai-for-business, ai-governance-leaders, llm-cost]
  - id: sales
    title: AI for Sales
    audience: Sales reps, SDRs, sales leaders
    courses: [ai-for-all, ai-for-sales, ai-sales-agents]
  - id: marketing
    title: AI for Marketing
    audience: Marketing and content teams
    courses: [ai-for-all, ai-for-marketing, ai-content-governance]
  - id: engineer
    title: AI Engineer
    audience: Software and data engineers
    courses: [ai-engineer, ai-lifecycle, llm-cost, ai-security-builders]
  - id: genai_engineer
    title: GenAI Engineer
    audience: Developers building LLM applications
    courses: [agentic-ai-workshop, genai-engineer, rag-advanced, agentic-engineer, ai-evals, llm-cost, ai-security-builders]
  - id: data_mlops
    title: Data & MLOps
    audience: Data engineers, ML engineers, platform teams
    courses: [data-foundations-ai, mlops, ai-lifecycle, ai-finops]
  - id: governance
    title: AI Governance, Risk & Compliance
    audience: Risk, compliance, legal, audit, security
    courses: [ai-governance-leaders, ai-governance-practitioner, ai-security-builders]
  - id: professional
    title: Individual Professionals (career track)
    audience: Individuals upskilling for AI roles
    courses: [ai-for-all, ai-use-case-design, rag-nontechnical, genai-engineer, ai-evals, ai-lifecycle]

# ═════════════════════════════════════════════════════════════════════════════
