# Agentic AI & LLM Economics — audience variants.
# One content bank (slides.yaml + demos + labs); this file says, per audience, which slides to keep, what to add,
# how to talk, which labs and platform to use, and what "done" looks like. Build all variants:
#   python training-materials/agentic-ai-workshop/build_variants.py     → variants/<id>/ (deck .pptx, facilitator-guide.md, exercises.md, README.md)
version: "1.0"
last_reviewed: "2026-09-20"

variants:

  corporate:
    title: "Agentic AI & LLM Economics — Enterprise edition"
    audience: "Mixed enterprise room: function heads, product owners, analysts, engineers (up to 25)"
    duration_days: 2
    tone: "Formal, evidence-led. Every claim has a number. Use the client's own use cases from discovery."
    platform: "Client tenant preferred: Azure OpenAI / Copilot Studio, Vertex AI / Gemini, Bedrock, or Databricks. Ours as fallback."
    prerequisites: ["20 curated documents a week before", "Accounts provisioned and tested", "Two named use cases from discovery", "Security sign-off on tools used in labs"]
    keep_slides: all
    drop_slides: []
    add_modules:
      - {after: "Model generations", title: "Where this sits in your operating model", minutes: 20,
         talk: "Map the ladder to their landscape: which questions today are simple / normal / complex; which systems the router would need; who owns the eval set. Pull the readiness domains on screen: data, platform, governance, skills. Ask the sponsor which one blocks scale."}
      - {after: "safety rails", title: "Governance you can defend", minutes: 25,
         talk: "Risk tiers in EU AI Act language, the pre-production review gate, the inventory. Show the governance engine classify one of their use cases live. 'Regulators ask for the inventory first.'"}
    labs:
      lab0: "Hour-one win on the client's documents"
      lab1: "Cost the two discovery use cases: best / expected / worst"
      lab2: "Grounded assistant on client documents in the client tenant; before/after score"
      lab3: "Agent with three tools drawn from their systems (read-only), cap + approval gate"
      lab4: "Apply three cost controls to Lab 1"
      lab5: "90-day plan per table, presented to the sponsor"
    done_when: "Each table shows a scored assistant and a capped agent on client material; sponsor holds five costed 90-day plans; a risk tier is recorded for each."
    follow_up: ["Readiness audit (Silver+) within 30 days", "Pilot charter for the top plan", "Governance quick-start"]

  business:
    title: "Agentic AI for Growing Businesses — 1 day"
    audience: "Founders, managers and their key staff (up to 15); little or no technical background"
    duration_days: 1
    tone: "Direct and practical. Money and hours, not architecture. Say 'this costs ₹X and saves Y hours' constantly."
    platform: "No-code only: NotebookLM for hour one, Dify or n8n for the build. No licences to buy."
    prerequisites: ["10 real documents (policies, price lists, FAQs)", "One workflow they hate", "Laptops with a browser"]
    # keep/drop match slide titles by case-insensitive substring
    keep_slides: ["Agentic AI & LLM Economics", "How the two days run", "Lab 0", "Module 2", "prediction machine", "Demo 2", "Tokens", "Context window", "Demo 1", "Lab 1", "Module 4", "Four levels", "cutting the cards", "Demo 3", "most important sentence", "Lab 2", "answer is wrong", "Module 6", "Vending machine", "safety rails", "Demo 5", "agent is the wrong answer", "Modules 7", "Demo 6", "Cost controls", "Regular use", "ROI you can defend", "Demo 7", "Governance quick start", "Lab 5", "Five things", "close"]
    drop_slides: []
    add_modules:
      - {after: "safety rails", title: "When NOT to use an agent (most of the time)", minutes: 15,
         talk: "For a 15-person business, an agent is rarely the answer in year one. The wins are: a grounded assistant on your documents, one automated workflow, and everyone using AI tools properly. Agents come when a workflow crosses three systems and nobody wants to babysit it."}
      - {after: "ROI you can defend", title: "Tools that cost nothing to start", minutes: 15,
         talk: "Walk the free/education tiers: NotebookLM, Dify cloud free, n8n cloud trial, ChatGPT/Claude/Gemini business seats and what they actually cost per month. The $42 bot. Show the automation ROI engine on their workflow."}
    labs:
      lab0: "Hour-one win on their own documents"
      lab1: "Cost one feature they'd actually build"
      lab2: "Grounded assistant in Dify on their documents; score 10 questions; hybrid + rerank toggles"
      lab5: "One-page 90-day plan for the one workflow they hate"
    done_when: "Every participant leaves with a working assistant on their documents, a monthly cost figure, and one workflow plan with a payback number."
    follow_up: ["Free readiness snapshot", "Bronze automation engagement for the top workflow", "AI for Sales / Marketing half-days"]

  university:
    title: "AI, RAG & Agents — Student Bootcamp (2 days) / Faculty Development (1 day)"
    audience: "Undergraduate / postgraduate students (CS, IT, MBA, commerce) in batches of up to 40 with a TA; or faculty"
    duration_days: 2
    tone: "Energetic, portfolio-driven. Every lab produces something for GitHub. Interview questions woven in from uniAI Quest."
    platform: "Free tiers: Google Colab notebooks (code track), Dify/NotebookLM (no-code track). Optional: student credits on a cloud."
    prerequisites: ["Computer lab or own laptops with browser", "GitHub accounts", "Python installed for the code track"]
    keep_slides: all
    drop_slides: ["Regular use vs strategic use", "ROI you can defend", "Governance quick start"]
    add_modules:
      - {after: "How the two days run", title: "Why this matters for your first job", minutes: 10,
         talk: "Show three real job posts asking for RAG / agents / evals. 'The person who can explain why the bot is wrong is rarer than the person who can call an API.'"}
      - {after: "answer is wrong", title: "Interview round: RAG", minutes: 20,
         talk: "Run three uniAI Quest interview challenges live (rag-70, cost-estimate, injection). Pairs answer, room votes, reveal 'what interviewers listen for'."}
      - {after: "safety rails", title: "Portfolio project: build it like production", minutes: 20,
         talk: "Definition of Done for the capstone: eval set in repo, README with architecture diagram, cost estimate, one injection test. This is what you show in the interview."}
      - {after: "Five things", title: "Certificates and next steps", minutes: 10,
         talk: "AI Aware certificate for attendance + quiz; AI Practitioner for a capstone that meets the DoD within two weeks. Course Finder for the path. uniAI Quest free tier to keep practising."}
    labs:
      lab0: "Hour-one win on provided sample docs"
      lab1: "Cost a chatbot for the college (admissions FAQ)"
      lab2: "Code track: Colab notebook — chunk, embed, hybrid, rerank, score. No-code track: Dify"
      lab3: "Agent with three tools (course catalogue search, timetable lookup, draft email) with caps"
      lab5: "Capstone plan: a RAG or agent project for the college or a local business, with eval set and cost"
    assessment: "Quiz (uniAI Quest topics: ai-basics, rag, agents, tokens-cost) + capstone reviewed against the Definition of Done"
    done_when: "Every student has a GitHub repo with a working RAG notebook or Dify app, a test sheet and a cost estimate; top capstones presented."
    follow_up: ["Semester elective (GenAI Engineer track)", "Faculty train-the-trainer", "Placement-prep cohort on uniAI Quest Silver"]

  domain:
    title: "AI for <Domain> Teams — no code, your documents (1 day)"
    audience: "Non-technical domain teams: legal, healthcare admin, finance, HR, operations, retail, public sector (up to 20)"
    duration_days: 1
    tone: "Plain language, one analogy (the new colleague and the library), zero jargon. Every example rebuilt around their documents and vocabulary."
    platform: "No-code only; hosted by us or in the client's approved tool (Copilot, Gemini, NotebookLM Enterprise) depending on data rules."
    prerequisites: ["Domain documents cleared for use", "Data rules confirmed (what may be uploaded)", "One domain expert in the room"]
    keep_slides: ["Agentic AI & LLM Economics", "Lab 0", "Module 2", "prediction machine", "Demo 2", "Context window", "Module 4", "Four levels", "cutting the cards", "Two ways to search", "Demo 3", "most important sentence", "Lab 2", "answer is wrong", "Module 6", "Vending machine", "safety rails", "agent is the wrong answer", "Lab 5", "Five things", "close"]
    drop_slides: []
    add_modules:
      - {after: "Demo 2", title: "What this means in your domain", minutes: 20,
         talk: "Domain-specific failure stories: the invented clause, the wrong dosage unit, the out-of-date policy. Then the rule: the assistant cites or it doesn't answer. Confidentiality: what may never be uploaded, decided before the lab."}
      - {after: "safety rails", title: "Human in the loop, by design", minutes: 20,
         talk: "Where the human sits for their workflow: review before send, sampling, escalation. Draft, never decide. Show the governance classify tool: most of their use cases are 'limited' — transparency plus a human path."}
      - {after: "Five things", title: "Your 30-day habit", minutes: 15,
         talk: "One assistant, one test sheet, one owner. Add every wrong answer to the sheet. Show it to three colleagues. Don't expand the library yet."}
    labs:
      lab0: "Hour-one win on their documents"
      lab2: "Grounded assistant on their documents; 10 real questions from their week; one change at a time"
      lab5: "Test sheet + owner + escalation path for one real task"
    done_when: "Every participant has an assistant that answers from their documents with citations and refuses otherwise, a 10-question test sheet, and a named owner."
    follow_up: ["Build Your Own AI Bot (4 half-days)", "Domain readiness snapshot", "Bronze automation engagement"]

  college:
    title: "AI, RAG & Agents — College Placement Bootcamp (1 day) or 2-day with capstone"
    audience: "Diploma / undergraduate students (any stream) in batches of up to 60 with two TAs; placement-focused"
    duration_days: 1
    tone: "High energy, competitive, hands-on within 15 minutes. Short explanations, long labs. Quiz rounds with a leaderboard from uniAI Quest. Every slide answers 'why does this get me a job'."
    platform: "Free tiers only: NotebookLM / Dify for everyone; Colab notebook for the code-track volunteers. No installs. Works on phones for the quizzes."
    prerequisites: ["Computer lab or own laptops with browser; phones OK for quizzes", "Wi-Fi tested for 60 devices", "uniAI Quest free accounts created in the first 10 minutes"]
    keep_slides: ["Agentic AI & LLM Economics", "How the two days run", "Lab 0", "Module 2", "prediction machine", "Demo 2", "Tokens", "Context window", "Module 4", "Four levels", "cutting the cards", "Two ways to search", "Demo 3", "most important sentence", "Lab 2", "answer is wrong", "Module 6", "Vending machine", "safety rails", "Demo 5", "agent is the wrong answer", "Five things", "close"]
    drop_slides: ["Regular use vs strategic use", "ROI you can defend", "Governance quick start", "Model generations"]
    add_modules:
      - {after: "How the two days run", title: "What recruiters actually ask", minutes: 10,
         talk: "Three real interview questions on screen: 'Why does a chatbot make things up?', 'What is RAG?', 'How would you stop an agent from running forever?' — you will be able to answer all three by 5 pm. Set up uniAI Quest on phones now; the leaderboard runs all day."}
      - {after: "Demo 2", title: "Quiz round 1 · AI basics", minutes: 10,
         talk: "Five questions on uniAI Quest, ai-basics topic, on phones. Leaderboard on the projector. Explain the two most-missed questions."}
      - {after: "Lab 2", title: "Quiz round 2 · RAG", minutes: 10,
         talk: "Five questions, rag topic. Then one interview challenge (rag-70) answered by a volunteer, room votes, reveal what interviewers listen for."}
      - {after: "safety rails", title: "Quiz round 3 · Agents + your portfolio", minutes: 15,
         talk: "Five questions, agents topic. Then the portfolio rule: one GitHub repo, README with a diagram, a 10-question test sheet, a cost estimate. That repo is your interview answer. Show the Course Finder: paste your profile, get your path."}
    labs:
      lab0: "Hour-one win on the provided sample docs (college handbook / placement FAQ)"
      lab2: "Everyone: Dify/NotebookLM bot on the sample docs, 10 questions scored. Code-track volunteers: Colab notebook"
      lab3: "Agent demo walked through together (no-code path); volunteers change one tool"
      lab5: "Capstone pitch: a RAG bot for the college or a local shop — problem, documents, test questions, cost — 2 minutes per team"
    assessment: "Three quiz rounds (leaderboard) + capstone pitch; AI Aware certificate for quiz ≥ 70%"
    done_when: "Every student has played 3 quiz rounds, built or driven a bot on real documents, and pitched a capstone; top three teams named."
    follow_up: ["uniAI Quest free tier (daily practice)", "Course Finder → Individual Professional track", "2-day university bootcamp with capstone"]

  nontech:
    title: "AI Without Code — Understand it, Use it Safely, Get Value (1 day)"
    audience: "Non-technical professionals from any function or small business owners (up to 20). No prior AI use assumed."
    duration_days: 1
    tone: "Calm, plain English, one analogy for the whole day. No acronyms without a picture. Long pauses for questions. Confidence over coverage."
    platform: "Whatever they already have: ChatGPT / Claude / Gemini / Copilot in a browser, plus NotebookLM for the documents lab. Nothing to install."
    prerequisites: ["A laptop with a browser", "Three documents from their own work they are allowed to share", "Their company's AI policy if one exists"]
    keep_slides: ["Agentic AI & LLM Economics", "Lab 0", "Module 2", "prediction machine", "Demo 2", "Context window", "Module 4", "cutting the cards", "Demo 3", "most important sentence", "Lab 2", "answer is wrong", "Vending machine", "agent is the wrong answer", "Five things", "close"]
    drop_slides: ["Tokens", "Structured output", "Model generations", "Two ways to search", "safety rails", "Regular use vs strategic use", "ROI you can defend"]
    add_modules:
      - {after: "Demo 2", title: "What you may and may not paste in", minutes: 20,
         talk: "The four boxes: public, internal, confidential, personal data. Which tool is approved for which box. The salary-leak story. Rule: if in doubt, don't."}
      - {after: "answer is wrong", title: "Prompts that work, folklore that doesn't", minutes: 25,
         talk: "Give context, give the format, give an example, ask for the source. Live: rewrite the same request three ways on their task. Then the folklore list — please, tips, threats — and why none of it does anything."}
      - {after: "Vending machine", title: "Automate one weekly task", minutes: 40,
         talk: "Each person picks one task they do every week: meeting notes to actions, a report from raw notes, a research brief with sources, a first-draft reply. Build it with saved prompts. Show one to the room."}
      - {after: "Five things", title: "Your 5 rules card and what to do Monday", minutes: 10,
         talk: "Verify facts · protect data · be specific · give context · you own the output. Monday: use the one automation you built, three times. Then decide what's next."}
    labs:
      lab0: "Hour-one win on their own three documents"
      lab2: "A documents assistant on their files in NotebookLM; 10 real questions; where did it get each answer?"
      lab5: "One automated weekly task with saved prompts, demonstrated to the room"
    assessment: "15-question quiz (AI Aware certificate at 70%) + one demonstrated automation with verification notes"
    done_when: "Every participant has a documents assistant on their own files, one weekly task automated, and the 5-rules card."
    follow_up: ["AI Productivity Workflows (half day)", "Build Your Own AI Bot (4 half-days)", "Free readiness snapshot for their team"]
