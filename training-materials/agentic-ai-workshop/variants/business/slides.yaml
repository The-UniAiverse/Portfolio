deck:
  title: Agentic AI for Growing Businesses — 1 day
  subtitle: A working workshop — understand, build, cost, decide
  brand: uniAIverse
  footer: uniAIverse · Agentic AI for Growing Businesses — 1 day · v1.0
  file: deck-business
slides:
- type: title
  title: Agentic AI for Growing Businesses — 1 day
  subtitle: Founders, managers and their key staff (up to 15); little or no technical background
  notes: 'Welcome. State the promise and the rule: nothing is ''just'' anything. Mixed room: leaders decide, analysts frame, engineers build — every lab has a no-code path and a code path.'
- type: bullets
  title: How the two days run
  bullets:
  - Day 1 AM — how it actually works (tokens, cost, models)
  - 'Day 1 PM — the RAG ladder: basic → advanced → hybrid → agentic'
  - Day 2 AM — agents that don't run away
  - Day 2 PM — strategy, optimisation, ROI, your 90-day plan
  - Five labs. Every table leaves with a bot, an agent and a costed plan.
  notes: 'Point at the wall poster with the master analogy: the brilliant new colleague who has never worked here. Everything maps to it.'
- type: lab
  title: Lab 0 · The hour-one win
  bullets:
  - Upload 2–3 of your own documents into the instant tool
  - Ask five questions. Then ask one thing about your company it can't know.
  - 'Flipchart: what worked, what failed'
  duration: 45 min
  notes: Never start with theory. The failures on the flipchart are the curriculum — we return to them at the close of Day 2.
- type: section
  title: Module 2 · How it actually works
- type: two_col
  title: It's a prediction machine
  left:
  - Autocomplete that has read most of the internet
  - Always produces a next word — that's the job
  - No database inside. Nothing stored, nothing looked up.
  right:
  - So when it doesn't know, it doesn't say so
  - It produces the most plausible continuation
  - Fluent, confident, wrong — a hallucination
  - 'Not a bug: the machine doing its job where that job is wrong'
  notes: 'Phone autocomplete demo. Then the exam-hall analogy: a person who read 10,000 books, in a room with no books, asked for the number on page 247.'
- type: demo
  title: Demo 2 · The confident wrong answer
  bullets:
  - 'Closed-book: ask about your company'
  - 'Open-book: same question with the right page on the desk'
  - Same model. The difference is the library.
  command: python demos/02_hallucination.py
  notes: If a key is configured, ask live about the client's own policy. If not, the recorded exchange shows the identical pattern.
- type: table
  title: 'Tokens: the billing unit'
  header:
  - Thing
  - Rule of thumb
  rows:
  - - 1 token
    - about ¾ of a word
  - - 1 page
    - about 700 tokens
  - - Output
    - costs ~5× input
  - - Cached input
    - ~90% off when the same prefix is sent again
  - - Reasoning tokens
    - billed as output — buy deliberately
  notes: Tokenise a sentence live. The numbers move every quarter; the shape of the argument doesn't.
- type: bullets
  title: Context window = the desk
  bullets:
  - What fits on the desk when the assistant answers
  - Why not paste everything in? Money · speed · accuracy · permissions
  - '500-page handbook, 1,000 questions a day: ~$20,000/month pasted vs ~$300/month fetched'
  - Fetch the right 8 pages first. That's RAG.
  notes: The one number they'll repeat to their boss. Say it slowly.
- type: demo
  title: Demo 1 · What does one question cost?
  bullets:
  - System + context + history + question → input
  - Answer → output
  - Three tiers, with and without caching
  - 'The two explosions: history and flagship-for-everything'
  command: python demos/01_tokens_and_cost.py
  notes: 'Whiteboard the formula before running the script. Ask: which of these lines does your dashboard show?'
- type: lab
  title: Lab 1 · Cost one real feature
  bullets:
  - Pick a feature from your business
  - 'Fill the token table: best / expected / worst'
  - Name the explosion most likely for you
  duration: 20 min
  notes: Exercise sheet page 1. Walk the room; the most common mistake is forgetting output tokens.
- type: section
  title: Module 4 · The RAG ladder
- type: table
  title: Four levels — and when each is right
  header:
  - Level
  - What it adds
  - You need it when
  - Cost / speed
  rows:
  - - Basic
    - fetch, answer
    - clean FAQ
    - 1×
  - - Advanced
    - rewriting, hybrid search, reranking, contextual chunks
    - real company documents — where most systems should live
    - 1.1×
  - - Hybrid
    - several stores + a router
    - documents AND a database AND live systems
    - 1.3×
  - - Agentic
    - the model decides, checks, retries
    - multi-step, cross-system questions
    - 5–10×, 10× slower
  notes: Earn your way up. An agent does not fix bad retrieval — it repeats it five times at five times the cost.
- type: bullets
  title: 'Where quality is won: cutting the cards'
  bullets:
  - Cut at headings and sections, never at word counts
  - One idea per card, ~300–500 words, readable cold
  - Never split a table; repeat the header row
  - Write where it came from on top of every card — the cheapest large improvement there is
  notes: 'Read a bare chunk aloud: ''The amount shall be recognised evenly…'' — nobody knows what it''s about. Add the prefix and it becomes findable.'
- type: demo
  title: Demo 3 · Basic vs Advanced, one change at a time
  bullets:
  - Fixed chunks → heading chunks + prefix
  - + hybrid search (RRF)
  - + reranking (drops the superseded draft)
  - Then a grounded answer, and a refusal
  command: python demos/03_rag_basic_vs_advanced.py
  notes: Watch the scoreboard go 3 → 5. Point at the DRAFT document being demoted by the reranker — 'old cards survive' unless you handle it.
- type: bullets
  title: The most important sentence in your bot
  bullets:
  - Answer using ONLY the documents provided.
  - For every fact, say which document it came from.
  - 'If the documents don''t contain the answer, say exactly: ''I could not find this in the available documents.'''
  - It turns a lie into a report — and a report into a number on a dashboard.
  notes: 'Leave this slide up. Count how often ''not found'' happens: that number is a direct measure of library quality.'
- type: lab
  title: Lab 2 · Build your grounded assistant
  bullets:
  - Your 10–20 documents into the tool
  - Score 10 real questions — the 'before' number
  - Hybrid on → re-score. Reranker on → re-score.
  - Read five of your chunks. Out loud.
  duration: 45 min
  notes: 'One change at a time — enforce it. This is where the course clicks: their own score goes up because of a decision they made.'
- type: bullets
  title: When the answer is wrong — in this order
  bullets:
  - 1. Was the right page fetched? No → library problem. Chunking, search. Rewriting instructions won't help.
  - 2. Fetched but ignored? Strengthen the instruction, send fewer cards.
  - 3. Fetched, used, still wrong? Now it's the prompt — or the card itself is wrong.
  - Most people start at 3. Almost every problem is at 1.
  notes: 'Handout: the fault-finding card.'
- type: section
  title: Module 6 · Agents that don't run away
- type: two_col
  title: Vending machine vs librarian
  left:
  - 'What you built yesterday: press a button, one item drops'
  - Wrong item? Nothing you can do
  - Question → one search → answer
  right:
  - An agent goes to the shelf, reads, thinks 'this only answers half', goes again
  - Think → look → read → judge → answer or try again
  - And when it isn't in the collection, it says so
  notes: 'The loop on the whiteboard, drawn slowly. Then the warning: ALWAYS with a limit, or it runs forever.'
- type: bullets
  title: The five safety rails — none optional
  bullets:
  - Max iterations (5–10)
  - Max cost per run · max wall-clock
  - 'Loop detection: same tool + same args twice → stop'
  - A required 'I give up' path that reports what it tried
  - Human approval for anything consequential or irreversible
  notes: Without these, one badly-worded question can loop for twenty minutes and cost more than the month. Demo 5 hits every rail.
- type: bullets
  title: When NOT to use an agent (most of the time)
  bullets:
  - For a 15-person business, an agent is rarely the answer in year one.
  - 'The wins are: a grounded assistant on your documents, one automated workflow, and everyone using AI tools properly.'
  - Agents come when a workflow crosses three systems and nobody wants to babysit it.
  notes: 'For a 15-person business, an agent is rarely the answer in year one. The wins are: a grounded assistant on your documents, one automated workflow, and everyone using AI tools properly. Agents
    come when a workflow crosses three systems and nobody wants to babysit it.'
- type: demo
  title: Demo 5 · An agent with rails
  bullets:
  - 'Scenario 1: reads, checks policy, asks a human, acts'
  - 'Scenario 2: the human says no — the agent stops with a draft'
  - 'Scenario 3: the model repeats itself — loop detection ends it cleanly'
  command: python demos/05_agent.py
  notes: 'Point at the gate: issue_refund is the only tool that changes the world, and it''s the only one behind a human.'
- type: bullets
  title: When an agent is the wrong answer
  bullets:
  - Simple, high-volume questions where speed matters
  - Anything a script already does reliably
  - A poor library — the agent fails five times instead of once
  - 'A well-tuned Advanced bot: < 1 s, fraction of a cent. An agent: ~12 s, 30× tokens — for the same answer'
  notes: Go up a level only when you hit a wall you can name.
- type: section
  title: Modules 7–10 · Money, strategy, ROI
- type: demo
  title: Demo 6 · Token optimisation and smart routing
  bullets:
  - Baseline → caching → history trim → k=5 → output cap
  - All-cheap vs all-agentic vs routed
  - Sort your questions before you spend
  command: python demos/06_routing_economics.py
  notes: 'Order of payoff: caching → routing → batch → output limits → rerank 50 not 500 → quantised indexes.'
- type: table
  title: Cost controls in order of payoff
  header:
  - Control
  - Typical saving
  rows:
  - - Prompt caching — static parts first
    - up to 90% of input
  - - Model routing / cascade
    - 60–80%
  - - Batch API for async work
    - 50%
  - - History trimming + output limits
    - 30–50% on chat
  - - Rerank the top 50, not 500
    - linear
  - - Quantised indexes
    - 4–32× storage
  notes: 'Lab 4: apply three of these to the Lab 1 sheet.'
- type: bullets
  title: Regular use vs strategic use
  bullets:
  - 'Regular: personal productivity — drafting, summarising, research. Table stakes.'
  - 'Strategic: a workflow redesigned with AI in it, measured, owned, governed'
  - 'Five value patterns: assist · automate · augment decisions · new products · risk'
  - Prioritise on value × feasibility × risk × effort; quick wins first, strategic bets second
  notes: Open the uniAIverse strategy tool live with a table's use cases.
- type: bullets
  title: ROI you can defend
  bullets:
  - Volume × minutes × loaded cost + error cost = what it costs today
  - × automation share = saving; − run cost = net; build ÷ net = payback
  - 'Approach per workflow: scripts · LLM · hybrid · agent · not yet'
  - Human in the loop designed per approach, not bolted on
  notes: Demo 7 runs the engines on two workflows and three use cases — the same arithmetic Lab 5 does on paper.
- type: bullets
  title: Tools that cost nothing to start
  bullets:
  - 'Walk the free/education tiers: NotebookLM, Dify cloud free, n8n cloud trial, ChatGPT/Claude/Gemini business seats and what they actually cost per month.'
  - The $42 bot.
  - Show the automation ROI engine on their workflow.
  notes: 'Walk the free/education tiers: NotebookLM, Dify cloud free, n8n cloud trial, ChatGPT/Claude/Gemini business seats and what they actually cost per month. The $42 bot. Show the automation ROI engine
    on their workflow.'
- type: demo
  title: Demo 7 · From numbers to a roadmap
  bullets:
  - Two workflows → approach, saving, payback
  - Three use cases → quadrants → three phases
  command: python demos/07_roi_and_plan.py
  notes: Then show the PDF the tool produces — that's the deliverable a client receives.
- type: bullets
  title: Governance quick start — 30 days
  bullets:
  - Inventory every AI system and tool in use
  - 'Risk-classify: prohibited · high · limited · minimal'
  - 'One-page policy: approved tools, prohibited data, review gate, disclosure'
  - A review checkpoint before anything reaches customers or staff decisions
  notes: Not legal advice; framework-aligned. The governance tool generates the policy and the gap assessment.
- type: lab
  title: Lab 5 · Your 90-day plan
  bullets:
  - 'One workflow: outcome, approach, cost range, ROI, owner, gates'
  - RAG level and agent-or-not, with a reason
  - Risk tier and human oversight
  - Three minutes to present
  duration: 40 min
  notes: Exercise sheet page 5. Push every table to something narrow. 'Everything' is not a plan.
- type: close
  title: Five things to remember
  bullets:
  - No database inside — it predicts. That's why it invents.
  - Fetch the right pages first. Five right beat fifty mediocre.
  - When it's wrong, look at what it fetched before blaming the model.
  - Agents amplify retrieval quality — good or bad. Earn your way up; cap everything.
  - 'Cost is a design decision: cache, route, trim, tier.'
  notes: 'Close with the two-week check: at least one plan with an owner and a date. Offer the readiness snapshot and a follow-up call.'
