services:
  api:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    volumes: ["../outputs:/srv/outputs"]
    expose: ["8000"]
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile", "caddy_data:/data"]
volumes: { caddy_data: {} }
