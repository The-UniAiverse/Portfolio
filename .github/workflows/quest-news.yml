# Daily: fetch curated AI news sources into the pending queue. Nothing goes public until approved in /admin.
name: quest-news-refresh
on:
  schedule: [{ cron: "30 2 * * *" }]   # 08:00 IST
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -X POST "${{ secrets.API_URL }}/api/quest/admin/news/refresh" -H "X-Admin-Token: ${{ secrets.ADMIN_TOKEN }}"
