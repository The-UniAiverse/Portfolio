name: api-ci
on:
  push:
    paths: ["apps/api/**", ".github/workflows/api-ci.yml"]
  pull_request:
    paths: ["apps/api/**", ".github/workflows/api-ci.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      LLM_PROVIDER: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: pytest -q

  docker:
    # Builds the production image exactly as Render will, so a broken Dockerfile fails here, not on deploy.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t uniaiverse-api:ci apps/api
      - name: Smoke test the image
        run: |
          docker run -d --name api -p 8000:8000 -e LLM_PROVIDER=none uniaiverse-api:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 1; done
          curl -sf localhost:8000/api/health
          docker exec api bun --version
          # Job search runs Bun inside the container (Linux). A crash here is a 500; if freehire.me itself is
          # unreachable the API answers 502, which must not fail our build.
          code=$(curl -s -o /tmp/jobs.json -w '%{http_code}' 'localhost:8000/api/jobs/search?q=python')
          echo "job search: HTTP $code"; head -c 300 /tmp/jobs.json; echo
          test "$code" != "500"
          docker logs api
