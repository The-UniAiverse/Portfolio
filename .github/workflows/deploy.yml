# Deploy to the uniaiverse.ai server on every merge to main (or manually). Requires secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_KEY.
name: deploy
on:
  push: { branches: [main] }
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd /srv/uniaiverse-ai-services && git fetch origin main && git reset --hard origin/main
            docker compose -f deploy/docker-compose.prod.yml up -d --build
            for i in $(seq 1 20); do docker compose -f deploy/docker-compose.prod.yml exec -T api python -c "import urllib.request; print(urllib.request.urlopen('http://localhost:8000/api/health', timeout=4).read().decode()[:80])" && exit 0; sleep 3; done
            echo "API did not become healthy — rolling back to the previous commit"; git reset --hard HEAD@{1} && docker compose -f deploy/docker-compose.prod.yml up -d --build; exit 1
