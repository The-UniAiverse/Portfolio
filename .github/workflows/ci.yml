name: ci
on:
  push: { branches: [main, dev, "features/**"] }
  pull_request: { branches: [main, dev] }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Validate YAML content files
        run: python -c "import yaml,glob; [yaml.safe_load(open(f)) for f in glob.glob('**/*.yaml', recursive=True)]; print('yaml ok')"
