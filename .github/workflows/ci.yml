name: ci
on:
  push: { branches: [main, dev, "features/**"] }
  pull_request: { branches: [main, dev] }
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Secrets scan (no keys or tokens in git)
        run: |
          if grep -rInE "(sk-ant-|sk-live-|rzp_live_)[A-Za-z0-9_-]{8,}|(ADMIN_TOKEN|RAZORPAY_KEY_SECRET|ANTHROPIC_API_KEY|OPENAI_API_KEY)=[A-Za-z0-9_-]{12,}" --exclude-dir=.git --exclude-dir=training-materials . ; then echo "Secret-looking value committed. Remove it and rotate the key."; exit 1; fi
      - name: Engine tests (API, Delivery Framework golden tests, course kits)
        run: pytest -q
      - name: Content + every course demo
        run: python scripts/validate_content.py
      - name: Cost analysis document matches the cost model
        run: python scripts/cost_report.py && git diff --exit-code -- docs/COST_ANALYSIS.md || (echo 'Run python scripts/cost_report.py and commit.' && exit 1)
      - name: Generated course kits are up to date
        run: python scripts/build_course_kits.py && git diff --exit-code -- training-materials || (echo "Run python scripts/build_course_kits.py and commit the result." && exit 1)
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Image builds and the app answers /api/health
        run: |
          docker build -t uniaiverse-api .
          docker run -d --name api -p 8000:8000 uniaiverse-api
          for i in $(seq 1 20); do curl -fs http://localhost:8000/api/health && exit 0; sleep 2; done; docker logs api; exit 1
