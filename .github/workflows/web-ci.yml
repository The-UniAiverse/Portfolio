name: web-ci
on:
  push:
    paths: ["apps/web/**", ".github/workflows/web-ci.yml"]
  pull_request:
    paths: ["apps/web/**", ".github/workflows/web-ci.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_AI_SERVICES_API_URL: http://localhost:8000
          # Build-only placeholders (not secrets): real values are set in Vercel.
          BETTER_AUTH_URL: http://localhost:3000
          BETTER_AUTH_SECRET: ci-build-placeholder-not-a-real-secret
